name: CI

# AGENTS.md のハード制約（トークン経由のみ・記号文字アイコン禁止・野良UI部品禁止・
# index.json との整合）を自動検出する。検査スクリプトは node の標準モジュールのみで
# 動くため依存インストールは不要（style-dictionary は build:tokens 専用の devDependency）。

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ds-rules:
    name: DS ハード制約チェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # index.json が component-spec.json / pattern.json と一致しているか
      - name: index.json の鮮度
        run: node scripts/generate-index.mjs --check

      # hex / px / 色キーワード / 色関数 / 記号文字アイコンの直書き
      - name: 生値・記号文字アイコンの検出
        run: node scripts/audit-tokens.mjs

      # DS 外 UI ライブラリの import と index.json に無い ds- クラス
      - name: 野良UI部品の検出
        run: node scripts/audit-components.mjs
