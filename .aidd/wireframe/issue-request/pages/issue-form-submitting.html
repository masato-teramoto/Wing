<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>発行依頼書 変更 — 送信中</title>
<link rel="stylesheet" href="tokens/tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="wf-main">
  <div class="wf-page-header wf-page-header--with-actions">
    <div class="wf-page-title-group">
      <h1 class="wf-page-title">発行依頼書 変更</h1>
      <span class="ds-badge">申請前</span>
      <span class="ds-badge ds-badge--neutral">契約書番号 2026-000123</span>
    </div>
  </div>

  <form>
  <section class="wf-section">
    <h2 class="wf-section-title">依頼の対象</h2>
    <div class="ds-radiobutton-group">
      <span class="ds-radiobutton">
        <input type="radio" id="mode-single" name="mode">
        <label for="mode-single">単独局</label>
      </span>
      <span class="ds-radiobutton">
        <input type="radio" id="mode-multi" name="mode" checked>
        <label for="mode-multi">複数局</label>
      </span>
      <span class="wf-mode-current">現在のモード: 複数局</span>
    </div>
    <p class="wf-section-note">モードを切り替えられる契機、切替で対象外になった入力内容の扱い、複数局モードで制御する項目とその制御内容は基本設計で確定します。</p>
  </section>
  <section class="wf-section">
    <h2 class="wf-section-title">発行依頼書の入力項目</h2>
    <p class="wf-section-note">項目の一覧・桁・必須は基本設計で確定します。ここでは項目数と配置のイメージのみを示しています。</p>
    <div class="wf-grid">
      <div class="wf-field">
        <label class="wf-field-label" for="item1">項目 1</label>
        <input class="ds-inputtext" id="item1" type="text" value="">
      </div>
      <div class="wf-field">
        <label class="wf-field-label" for="item2">項目 2</label>
        <input class="ds-inputtext" id="item2" type="text" value="">
      </div>
      <div class="wf-field">
        <label class="wf-field-label" for="item3">項目 3</label>
        <input class="ds-inputtext" id="item3" type="text" value="">
      </div>
      <div class="wf-field">
        <label class="wf-field-label" for="item4">項目 4</label>
        <input class="ds-inputtext" id="item4" type="text" value="">
      </div>
      <div class="wf-field">
        <label class="wf-field-label" for="item5">項目 5</label>
        <input class="ds-inputtext" id="item5" type="text" value="">
      </div>
      <div class="wf-field">
        <label class="wf-field-label" for="item6">項目 6</label>
        <input class="ds-inputtext" id="item6" type="text" value="">
      </div>
      <div class="wf-field wf-field--2">
        <label class="wf-field-label" for="item7">項目 7</label>
        <input class="ds-inputtext" id="item7" type="text" value="">
      </div>
      <div class="wf-field">
        <label class="wf-field-label" for="item8">項目 8</label>
        <input class="ds-inputtext" id="item8" type="text" value="">
      </div>
      <div class="wf-field">
        <label class="wf-field-label" for="amount">金額</label>
        <span class="wf-readonly-value" id="amount">1,234,000 円</span>
        <p class="wf-field-support">入力内容から自動で計算します。算式・対象項目・桁と丸めは基本設計で確定します。</p>
      </div>
    </div>
  </section>
    <div class="wf-actions">
      <button class="ds-button ds-button--primary" type="submit" aria-busy="true">保存しています</button>
      <button class="ds-button ds-button--secondary" type="button">申請する</button>
      <a class="ds-link" href="issue-form-edit-multi.html">キャンセル</a>
    </div>
  </form>
</main>
</body>
</html>
