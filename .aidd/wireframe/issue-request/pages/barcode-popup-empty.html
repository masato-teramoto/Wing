<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>バーコードの生成 — まだありません</title>
<link rel="stylesheet" href="tokens/tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="wf-main">
  <div class="wf-page-header wf-page-header--with-actions">
    <div class="wf-page-title-group">
      <h1 class="wf-page-title">バーコードの生成</h1>
    </div>
    <div class="wf-actions">
      <button class="ds-button ds-button--primary" type="button">バーコードを生成</button>
    </div>
  </div>
  <p class="wf-page-lead">バーコードの対象となる文書の単位・規格・桁、削除したバーコードの見え方と編集を制御する範囲は基本設計で確定します。</p>

  <div class="ds-emptystate">
    <p class="ds-emptystate-title">まだバーコードはありません</p>
    <p class="ds-emptystate-body">「バーコードを生成」から作成してください。</p>
    <button class="ds-button ds-button--secondary" type="button">バーコードを生成</button>
  </div>
