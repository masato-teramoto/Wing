<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作成組織検索 — 検索結果（2 ページ目）</title>
<link rel="stylesheet" href="tokens/tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="wf-main">

  <div class="wf-page-header">
    <h1 class="wf-page-title">作成組織検索</h1>
    <p class="wf-page-lead">選択した作成組織を、呼び出し元画面の作成組織欄に設定します。</p>
  </div>

  <form class="wf-filter">
    <div class="wf-field">
      <label class="wf-field-label" for="company">会社名<span class="wf-field-optional">※任意</span></label>
      <select class="ds-select" id="company" name="company">
        <option value="">選択してください</option>
        <option value="a" selected>株式会社サンプルA</option>
        <option value="b">株式会社サンプルB</option>
        <option value="c">株式会社サンプルC</option>
      </select>
    </div>
    <div class="wf-field">
      <label class="wf-field-label" for="department">部署名<span class="wf-field-optional">※任意</span></label>
      <select class="ds-select" id="department" name="department">
        <option value="">選択してください</option>
        <option value="nw" selected>ネットワーク本部</option>
        <option value="const">建設統括部</option>
        <option value="kansai">関西支店</option>
      </select>
    </div>
    <div class="wf-field">
      <label class="wf-field-label" for="section">所属名<span class="wf-field-optional">※任意</span></label>
      <select class="ds-select" id="section" name="section">
        <option value="" selected>選択してください</option>
        <option value="d1">電源設備グループ</option>
        <option value="d2">工事管理グループ</option>
        <option value="land">用地調達グループ</option>
      </select>
    </div>
    <div class="wf-filter-actions">
      <button class="ds-button ds-button--secondary" type="submit">検索</button>
      <button class="ds-button ds-button--secondary" type="reset">条件をクリア</button>
    </div>
  </form>

  <div class="wf-result-summary">
    <span class="wf-result-count">10 件</span>
    <span class="wf-applied-filters">絞り込み中: 会社名 株式会社サンプルA、部署名 ネットワーク本部</span>
  </div>

  <div class="ds-table-scroll" role="region" aria-label="作成組織の検索結果" tabindex="0">
    <table class="ds-table">
      <caption>作成組織の検索結果。所属名を選ぶと呼び出し元画面へ戻ります。</caption>
      <thead>
        <tr>
          <th scope="col">会社名</th>
          <th scope="col">部署名</th>
          <th scope="col">所属名</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>株式会社サンプルA</td>
          <td>ネットワーク本部</td>
          <td><a class="ds-link" href="zoom-search-page2.html">電源設備グループ</a></td>
        </tr>
        <tr>
          <td>株式会社サンプルA</td>
          <td>ネットワーク本部</td>
          <td><a class="ds-link" href="zoom-search-page2.html">工事管理グループ</a></td>
        </tr>
        <tr>
          <td>株式会社サンプルA</td>
          <td>ネットワーク本部</td>
          <td><a class="ds-link" href="zoom-search-page2.html">品質保証グループ</a></td>
        </tr>
        <tr>
          <td>株式会社サンプルA</td>
          <td>ネットワーク本部</td>
          <td><a class="ds-link" href="zoom-search-page2.html">用地調達グループ</a></td>
        </tr>
        <tr>
          <td>株式会社サンプルA</td>
          <td>ネットワーク本部</td>
          <td><a class="ds-link" href="zoom-search-page2.html">契約管理グループ</a></td>
        </tr>
      </tbody>
    </table>
  </div>

  <nav class="ds-pagination" aria-label="作成組織の検索結果のページ送り">
    <span class="ds-pagination-range">6–10 件 / 全 10 件</span>
    <span class="ds-pagination-controls">
      <a class="ds-link ds-link--button" href="zoom-search-default.html">前へ</a>
      <span class="ds-pagination-counter">2 / 2</span>
    </span>
  </nav>

</main>
</body>
</html>
