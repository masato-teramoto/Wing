<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作成組織検索 — 読み込み失敗</title>
<link rel="stylesheet" href="tokens/tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="wf-main">

  <div class="wf-page-header">
    <h1 class="wf-page-title">作成組織検索</h1>
    <p class="wf-page-lead">選択した作成組織を、呼び出し元画面の作成組織欄に設定します。</p>
  </div>

  <form class="wf-filter">
    <div class="wf-field">
      <label class="wf-field-label" for="company">会社名<span class="wf-field-optional">※任意</span></label>
      <select class="ds-select" id="company" name="company">
        <option value="">選択してください</option>
        <option value="a" selected>株式会社サンプルA</option>
        <option value="b">株式会社サンプルB</option>
        <option value="c">株式会社サンプルC</option>
      </select>
    </div>
    <div class="wf-field">
      <label class="wf-field-label" for="department">部署名<span class="wf-field-optional">※任意</span></label>
      <select class="ds-select" id="department" name="department">
        <option value="">選択してください</option>
        <option value="nw" selected>ネットワーク本部</option>
        <option value="const">建設統括部</option>
        <option value="kansai">関西支店</option>
      </select>
    </div>
    <div class="wf-field">
      <label class="wf-field-label" for="section">所属名<span class="wf-field-optional">※任意</span></label>
      <select class="ds-select" id="section" name="section">
        <option value="" selected>選択してください</option>
        <option value="d1">設計第一グループ</option>
        <option value="d2">設計第二グループ</option>
        <option value="land">用地調達グループ</option>
      </select>
    </div>
    <div class="wf-filter-actions">
      <button class="ds-button ds-button--secondary" type="submit">検索</button>
      <button class="ds-button ds-button--secondary" type="reset">条件をクリア</button>
    </div>
  </form>

  <div class="wf-inline-error">
    <p class="wf-inline-error-title">読み込めませんでした</p>
    <p class="wf-inline-error-body">再試行してください。解決しない場合はシステム管理者へお問い合わせください。</p>
    <button class="ds-button ds-button--secondary" type="button">再試行</button>
  </div>

</main>
</body>
</html>
