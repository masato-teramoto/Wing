<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>契約情報インポート — 実行の指示</title>
<link rel="stylesheet" href="tokens/tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="wf-main">
  <div class="wf-page-header">
    <h1 class="wf-page-title">契約情報インポート</h1>
    <p class="wf-page-lead">取込の処理はバッチが行います。この画面では実行の指示と受付の確認のみを行います。</p>
  </div>

  <nav class="wf-steps" aria-label="取込の実行手順">
    <span class="wf-step wf-step--current" aria-current="step">1. 入力</span>
    <span class="wf-step">2. 確認</span>
    <span class="wf-step">3. 完了</span>
  </nav>

  <form>
  <section class="wf-section">
    <h2 class="wf-section-title">取込の指定</h2>
    <p class="wf-section-note">画面で指定する項目は基本設計で確定します。取込の対象をこの画面からのアップロードで受け取るか所定の配置場所から読むかも確定していないため、この画面にはファイルを選ぶ欄を置いていません。</p>
    <div class="wf-grid">
      <div class="wf-field wf-field--2">
        <label class="wf-field-label" for="target">取込の対象<span class="wf-field-optional">※要否は基本設計で確定</span></label>
        <input class="ds-inputtext" id="target" type="text" value="サンプル指定">
        <p class="wf-field-support">対象の指定のしかたは基本設計で確定します。</p>
      </div>
      <div class="wf-field wf-field--2">
        <label class="wf-field-label" for="kind">実行する処理<span class="wf-field-optional">※要否は基本設計で確定</span></label>
        <select class="ds-select" id="kind">
          <option value="import" selected>新規・変更・削除の取込</option>
          <option value="refresh">洗替更新</option>
        </select>
        <p class="wf-field-support">取込と洗替更新を別々に指示するか同じタスクで行うかは基本設計で確定します。</p>
      </div>
    </div>
  </section>
    <div class="wf-actions">
      <button class="ds-button ds-button--primary" type="submit">確認へ進む</button>
      <a class="ds-link" href="import-input.html">キャンセル</a>
    </div>
  </form>
</main>
</body>
</html>
