<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>物件基本情報 — 権限がありません</title>
<link rel="stylesheet" href="tokens/tokens.css">
<style>
body{margin:0;background:var(--color-semantic-canvas);color:var(--color-semantic-text);font-family:system-ui,sans-serif;font-size:var(--font-size-body);line-height:1.6}
.wf-main{padding-left:var(--space-md);padding-right:var(--space-md);padding-top:var(--space-sm);padding-bottom:var(--space-lg)}
:focus-visible{outline-style:solid;outline-width:medium;outline-color:var(--color-semantic-focus);outline-offset:var(--space-xxs)}
.wf-page-header{margin-bottom:var(--space-sm)}
.wf-page-title{margin:0;font-size:var(--font-size-heading);line-height:1.4}
.wf-visually-hidden{position:absolute;width:0.0625rem;height:0.0625rem;margin:-0.0625rem;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}

.wf-field{display:flex;flex-direction:column;gap:var(--space-xs);min-width:0}
.wf-field-label{font-size:var(--font-size-caption);font-weight:700}
.wf-field-required{margin-left:var(--space-xs);color:var(--color-semantic-required);font-weight:400}
.wf-field-optional{margin-left:var(--space-xs);color:var(--color-semantic-text-subtle);font-weight:400}
.wf-field-support{color:var(--color-semantic-text-subtle);font-size:var(--font-size-caption)}

.ds-inputtext{min-height:2.75rem;padding-left:var(--space-sm);padding-right:var(--space-sm);background:var(--color-semantic-background);color:var(--color-semantic-text);border:thin solid var(--color-semantic-border);border-radius:var(--radius-sm);font-size:var(--font-size-body);font-family:inherit}
.ds-inputtext:disabled{background:var(--color-semantic-disabled-surface);color:var(--color-semantic-disabled-text)}
.ds-inputtext--error{border-color:var(--color-semantic-danger)}

.ds-button{display:inline-flex;align-items:center;justify-content:center;min-height:2.75rem;padding-left:var(--space-md);padding-right:var(--space-md);border-radius:var(--radius-sm);font-size:var(--font-size-body);font-family:inherit;line-height:1.4;cursor:pointer}
.ds-button--secondary{background:var(--color-semantic-background);color:var(--color-semantic-primary);border:thin solid var(--color-semantic-primary)}
.ds-button--secondary:hover{background:var(--color-semantic-surface-hover);color:var(--color-semantic-primary-hover);border-color:var(--color-semantic-primary-hover)}
.ds-button--primary{background:var(--color-semantic-primary);color:var(--color-semantic-on-primary);border:none}
.ds-button--primary:hover{background:var(--color-semantic-primary-hover)}
.ds-button--danger{background:var(--color-semantic-danger);color:var(--color-semantic-on-primary);border:none}
.ds-button--danger:hover{background:var(--color-semantic-danger-hover)}
.ds-button:disabled{background:var(--color-semantic-disabled-surface);color:var(--color-semantic-disabled-text);border-color:var(--color-semantic-disabled-surface);cursor:default}
.ds-button--sm{min-height:2.25rem;padding-left:var(--space-sm);padding-right:var(--space-sm);font-size:var(--font-size-caption)}

.ds-link{color:var(--color-semantic-primary);text-decoration:underline}
.ds-link:hover{color:var(--color-semantic-primary-hover)}
.ds-link--button{display:inline-flex;align-items:center;justify-content:center;min-height:2.75rem;padding-left:var(--space-md);padding-right:var(--space-md);background:var(--color-semantic-background);color:var(--color-semantic-primary);border:thin solid var(--color-semantic-primary);border-radius:var(--radius-sm);text-decoration:none}
.ds-link--button:hover{background:var(--color-semantic-surface-hover);color:var(--color-semantic-primary-hover);border-color:var(--color-semantic-primary-hover)}

.ds-badge{display:inline-flex;align-items:center;padding-left:var(--space-sm);padding-right:var(--space-sm);border-radius:var(--radius-full);font-size:var(--font-size-caption)}
.ds-badge--neutral{background:var(--color-semantic-surface-hover);color:var(--color-semantic-text-subtle)}

.ds-table-scroll{overflow-x:auto;background:var(--color-semantic-background);border:thin solid var(--color-semantic-border);border-radius:var(--radius-md)}
.ds-table{width:100%;min-width:44rem;border-collapse:collapse}
.ds-table caption{padding:var(--space-sm);color:var(--color-semantic-text-subtle);font-size:var(--font-size-caption);text-align:left}
.ds-table th,.ds-table td{padding-top:var(--space-sm);padding-bottom:var(--space-sm);padding-left:var(--space-ms);padding-right:var(--space-ms);border-bottom:thin solid var(--color-semantic-border);text-align:left;vertical-align:top;white-space:nowrap}
.ds-table th{background:var(--color-semantic-table-header);color:var(--color-semantic-text-subtle);font-weight:700}
.ds-table tbody tr:hover{background:var(--color-semantic-surface-hover)}

.ds-skeleton{background:var(--color-semantic-skeleton);border-radius:var(--radius-sm)}
.ds-skeleton--text{height:1rem}
.ds-skeleton--row{height:1.25rem}
.ds-skeleton-rows{padding:var(--space-ms)}
.ds-skeleton-rows > * + *{margin-top:var(--space-ms)}

.wf-errorpage{max-width:40rem;margin-left:auto;margin-right:auto;padding-top:var(--space-xl);text-align:center}
.wf-errorpage-title{margin:0;font-size:var(--font-size-heading)}
.wf-errorpage-body{margin-top:var(--space-md);margin-bottom:var(--space-lg)}

.wf-modal-backdrop{position:fixed;inset:0;background:var(--color-semantic-overlay);display:flex;align-items:center;justify-content:center;padding:var(--space-md)}
.ds-modaldialog{width:100%;max-width:32rem;background:var(--color-semantic-background);border:thin solid var(--color-semantic-border);border-radius:var(--radius-md);padding:var(--space-lg)}
.ds-modaldialog-header{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-md)}
.ds-modaldialog-title{margin:0;font-size:var(--font-size-body);font-weight:700}
.ds-modaldialog-body{margin-top:var(--space-sm);margin-bottom:var(--space-lg);color:var(--color-semantic-text-subtle)}
.ds-modaldialog-actions{display:flex;flex-wrap:wrap;gap:var(--space-sm);justify-content:flex-end}

.wf-grid{display:grid;grid-template-columns:1fr;gap:var(--space-md)}
@media (min-width:64rem){.wf-grid{grid-template-columns:repeat(4,1fr)}.wf-field--2{grid-column:span 2}.wf-field--4{grid-column:span 4}}

.wf-section{margin-bottom:var(--space-md);padding:var(--space-md);background:var(--color-semantic-background);border:thin solid var(--color-semantic-border);border-radius:var(--radius-md)}
.wf-section-title{margin:0;margin-bottom:var(--space-sm);font-size:var(--font-size-body);font-weight:700}
.wf-actions{display:flex;flex-wrap:wrap;gap:var(--space-sm);margin-top:var(--space-md)}

.wf-dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:var(--space-sm) var(--space-md)}
.wf-dl dt{color:var(--color-semantic-text-subtle);font-size:var(--font-size-caption)}
.wf-dl dd{margin:0}

.wf-page-header--with-actions{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:var(--space-md)}
.wf-page-title-group{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-sm)}
.ds-textarea{width:100%;padding:var(--space-sm);background:var(--color-semantic-background);color:var(--color-semantic-text);border:thin solid var(--color-semantic-border);border-radius:var(--radius-sm);font-size:var(--font-size-body);font-family:inherit;box-sizing:border-box}
.ds-fileupload{display:flex;flex-direction:column;gap:var(--space-xs)}
.wf-field-error{color:var(--color-semantic-danger);font-size:var(--font-size-caption)}
.wf-error-summary{padding:var(--space-md);margin-bottom:var(--space-md);background:var(--color-semantic-danger-subtle);border:thin solid var(--color-semantic-danger);border-radius:var(--radius-md)}
.wf-error-summary-title{margin:0;margin-bottom:var(--space-xs);color:var(--color-semantic-on-danger-subtle);font-weight:700}
.wf-error-summary ul{margin:0;padding-left:var(--space-lg)}
.wf-history-empty{color:var(--color-semantic-text-subtle)}
.ds-link--primary{background:var(--color-semantic-primary);color:var(--color-semantic-on-primary);border-color:var(--color-semantic-primary)}
.ds-link--primary:hover{background:var(--color-semantic-primary-hover);color:var(--color-semantic-on-primary);border-color:var(--color-semantic-primary-hover)}
</style>
</head>
<body>
<main class="wf-main">
  <div class="wf-errorpage">
    <h1 class="wf-errorpage-title">このページを表示する権限がありません</h1>
    <p class="wf-errorpage-body">物件基本情報を扱う権限が付与されていません。権限が必要な場合はシステム管理者へお問い合わせください。</p>
    <a class="ds-link ds-link--button" href="property-form-new.html">トップへ戻る</a>
  </div>
</main>
</body>
</html>
