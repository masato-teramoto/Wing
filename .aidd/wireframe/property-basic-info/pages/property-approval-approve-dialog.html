<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>物件基本情報の承認 — 承認の確認</title>
<link rel="stylesheet" href="tokens/tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="wf-main">
  <div class="wf-page-header wf-page-header--with-actions">
    <div class="wf-page-title-group">
      <h1 class="wf-page-title">物件基本情報の承認</h1>
      <span class="ds-badge">承認待ち</span>
    </div>
    <div class="wf-actions">
      <button class="ds-button ds-button--primary" type="button">承認</button>
      <button class="ds-button ds-button--secondary" type="button">差戻し</button>
    </div>
  </div>

  <section class="wf-section">
    <h2 class="wf-section-title">申請内容</h2>
    <p class="wf-section-note">項目の一覧は基本設計で確定します。ここでは項目数と配置のイメージのみを示しています。</p>
    <dl class="wf-dl">
      <dt>項目 1</dt><dd>サンプル値</dd>
      <dt>項目 2</dt><dd>サンプル値</dd>
      <dt>項目 3</dt><dd>サンプル値</dd>
      <dt>項目 4</dt><dd>サンプル値</dd>
      <dt>項目 5</dt><dd>サンプル値</dd>
      <dt>項目 6</dt><dd>サンプル値</dd>
      <dt>項目 7</dt><dd>サンプル値</dd>
      <dt>項目 8</dt><dd>サンプル値</dd>
      <dt>作成組織</dt><dd>株式会社サンプルA ネットワーク本部 設計第一グループ</dd>
      <dt>契約稟議に関するファイル</dt><dd><a class="ds-link" href="property-approval-pending.html">稟議添付資料_1.pdf</a></dd>
    </dl>
  </section>

  <div class="wf-modal-backdrop">
    <div class="ds-modaldialog" role="dialog" aria-modal="true" aria-labelledby="approve-title">
      <p class="ds-modaldialog-title" id="approve-title">承認しますか？ この操作は取り消せません</p>
      <div class="ds-modaldialog-body">
        <label class="wf-field-label" for="approve-comment">コメント<span class="wf-field-optional">※任意</span></label>
        <textarea class="ds-textarea" id="approve-comment" rows="4"></textarea>
      </div>
      <div class="ds-modaldialog-actions">
        <button class="ds-button ds-button--secondary" type="button">キャンセル</button>
        <button class="ds-button ds-button--primary" type="button">承認する</button>
      </div>
    </div>
  </div>
</main>
</body>
</html>
