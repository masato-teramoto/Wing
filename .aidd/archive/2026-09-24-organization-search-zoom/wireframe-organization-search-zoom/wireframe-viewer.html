<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作成組織検索（ZOOM）ワイヤーフレーム</title>
<link rel="stylesheet" href="pages/tokens/tokens.css">
<style>
  body {
    margin: 0;
    background: var(--color-semantic-canvas);
    color: var(--color-semantic-text);
    font-family: system-ui, sans-serif;
    font-size: var(--font-size-body);
    line-height: 1.6;
  }
  .viewer-notice {
    padding: var(--space-md);
    background: var(--color-semantic-surface);
    border-bottom: thin solid var(--color-semantic-border);
  }
  .viewer-notice h1 {
    margin: 0;
    font-size: var(--font-size-body);
  }
  .viewer-notice p {
    margin-top: var(--space-xs);
    margin-bottom: 0;
    color: var(--color-semantic-text-subtle);
    font-size: var(--font-size-caption);
  }
  .viewer-nav {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-md);
    padding: var(--space-sm) var(--space-md);
    border-bottom: thin solid var(--color-semantic-border);
    font-size: var(--font-size-caption);
  }
  .viewer-nav a {
    color: var(--color-semantic-primary);
  }
  .viewer-frame {
    display: block;
    width: 100%;
    height: 80vh;
    border: 0;
  }
</style>
</head>
<body>

<div class="viewer-notice">
  <h1>これは要件定義段階のワイヤーフレームです</h1>
  <p>画面の型・構成・情報量のイメージを掴むためのものです。この機能・この UI で実装することを確約するものではありません。</p>
  <p>色・書体・細部の見た目は未確定です。ブランドの色は基本設計の工程で決めます。</p>
  <p>画面に並ぶ項目名・桁・必須の別は未確定です。検索条件の要否、一覧の表示項目・並び順・表示件数の上限は基本設計で確定します。</p>
</div>

</nav>

</html>
