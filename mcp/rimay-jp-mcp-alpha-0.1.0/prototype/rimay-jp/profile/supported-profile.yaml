# Supported Profile v0.1 — SSOT（構想書 §21 Phase 1 / README「Supported Profile（MVP）」）
# システムプロンプト、Normalizer、Validator、Corpus、MCPツールはすべて本ファイルの同一版を参照する。
# Profile外の入力は「未対応」として明示的に返す（誤って成功扱いしない）。
# 0.1.2: japanese_surface.action_expressions を追加（ADR-0014 D6:
#   自由文動詞→family候補写像のSSOT化。旧candidate_extractor._VERB_CANDIDATES
#   のPython直書きを移設。挙動は同一）
# 0.2.0: DISPLAY IDをREFLEXIVE_APPEARANCE_48_1_2へ是正（D7 R-1/CG-09）、
#   english_conformance_binding参照とcomparison_operators/free_expression裁定を追加（C4・RC-005）
# 0.3.0: Comparison operatorの閉じた8値を英日runtimeへ一括接続（RC-069）
# 0.4.0: scalar predicateと相互排他のMulti-value treeを完全括弧表層で接続（RC-077）
# 0.5.0: legacy subjectとtyped Operator operandを相互排他で接続（RC-094）
profile_version: rimay-jp-mvp-0.5.0
schema_version: 0.1.0
# 版数規律（ADR-0013 D3）: 本ファイルまたはcase-frames.yamlの内容変更時は
# 最低patch版を上げる。加えてprofile_content_hash（両ファイルのsha256）を
# versions()・Validation Report・versions_usedへ併記し、宣言ドリフトを機械検出する。
# 改訂履歴:
#  - 0.1.1 (2026-08-05): japanese_surface節を追加（ADR-0013 D3。Normalizerの
#    解析定数をSSOTへ集約。scope宣言追補=Step Eを含む従来内容から挙動互換）

# 日本語表層定義（ADR-0013 D3: Normalizerはここからコンパイルする。
# role×格助詞の対応は lexicon/case-frames.yaml の japanese_case_mapping から導出し、
# 本ファイルには格フレームへ属さない表層知識のみを置く）
japanese_surface:
  modality_endings:                # 文末（列挙順に照合）
    - {surface: しなければならない, modality: MUST}
    - {surface: してはならない, modality: MUST_NOT}
  condition_terminals:             # 条件節末尾→条件型（列挙順に一致）
    - {surface: したとき, type: WHEN}
    - {surface: である場合, type: IF}
    - {surface: である間, type: WHILE}
    - {surface: した後に, type: AFTER}
    - {surface: した後, type: AFTER}
    - {surface: する前に, type: BEFORE}
    - {surface: ごとに, type: EVERY}          # Profile外（検出用）
    - {surface: を備える構成では, type: WHERE} # Profile外（検出用）
  comparison_operator_surfaces:    # 単値predicateの一意な日本語表層（alias推測禁止）
    IS: である
    EQUALS: と等しい
    NOT_EQUALS: ではない
    GREATER_THAN: より大きい
    LESS_THAN: より小さい
    GREATER_OR_EQUAL: 以上である
    LESS_OR_EQUAL: 以下である
    CONTAINS: を含む
  multi_value_connectors:          # value_expression内側。外側Condition式とは括弧depthで分離
    and: かつ
    or: または
  operator_operand_surfaces:
    declared_reference: {actor: アクター, class: クラス, property: プロパティ}
    instance_or_property: インスタンス／プロパティ
    ui_component_instance: UIコンポーネント
  trigger_verb_stems:              # トリガー動詞語幹→family（event用。PRESSは条件専用）
    押: PRESS
    送信: SEND
    更新: UPDATE
    生成: CREATE
    保存: STORE
    受信: RECEIVE
    検証: VERIFY
    通知: NOTIFY
    削除: DELETE
    表示: DISPLAY
    算出: CALCULATE
  action_expressions:              # 自由文動詞→family候補（複数=多義動詞。ADR-0014 D6）
    送る: [SEND]
    送付する: [SEND]
    出力する: [DISPLAY, CREATE]
    出力: [DISPLAY, CREATE]
    登録する: [CREATE, STORE, UPDATE]
    発行する: [CREATE]
    連絡する: [NOTIFY]
    消す: [DELETE]
  vague_words: [速やかに, 早急に, 遅滞なく, 適切に, 必要に応じて, 可能な限り, なるべく]
  deictic_words: [これ, それ, 当該, 上記, 前述]
  quantitative_patterns:
    deadline: '^([\d,，]+)秒以内に'
    retention: '^([\d,，]+)年間'

# English Rimay実行契約（0.2.0で参照追加。C3新設のSSOT）
# 束縛（family→rimay_action_id/emse_rule_id/動詞/前置詞Role写像）の実行正本は
# profile/english-rimay-conformance.yaml。本ファイルのaction_classesと
# lexicon/case-frames.yaml の宣言はcontract test（3者差分0）で同期を機械検査する。
english_conformance_binding: profile/english-rimay-conformance.yaml

# 条件比較演算子の裁定（0.2.0、CG-07/R6・RC-005）
# in: 全層（Schema/Parser/Serializer/equivalence）に実行経路を持つ演算子のみ
# out: 既知だがProfile外（PROFILE_OUT構造化応答。isへの縮退・黙殺を禁止）
comparison_operators:
  in: [IS, EQUALS, NOT_EQUALS, GREATER_THAN, LESS_THAN, GREATER_OR_EQUAL, LESS_OR_EQUAL, CONTAINS]
  out: []
  classification: rimay_jp_extension
  extension_feature: COMPARISON_OPERATOR
  paper_claim: withheld
free_expression: out   # R6裁定（D-015）: FreeExpressionはSupported Profile外で確定

multi_value:
  canonical_path: /rimay_core/conditions/*/predicate/value_expression
  expression_kinds: [value, group, and, or]
  scalar_authority: value/unit
  mutually_exclusive_with_scalar: true
  automatic_scalar_lifting: forbidden
  binary_form: fully_parenthesized
  unit_boundary: [JPY]
  classification: rimay_jp_extension
  extension_feature: MULTI_VALUE
  paper_claim: withheld

operator_value_expression:
  canonical_path: /rimay_core/conditions/*/predicate/operand
  identity_authority: [legacy_subject, typed_operand]
  mutually_exclusive_with_subject: true
  typed_operand_wrappers: [declared_reference, instance_or_property, ui_component_instance]
  declared_reference_kinds: [actor, class, property]
  typed_operand_requires: value_expression
  automatic_subject_typing: forbidden
  class_gap_synthesis: forbidden
  repository_mapping: preserved_only
  classification: rimay_jp_extension
  extension_feature: OPERATOR_VALUE_EXPRESSION
  paper_claim: withheld

# MVP対象の条件種別（§9のWHERE・EVERY「条件型」はProfile外 = 未対応として返す。
# 機能スコープは条件ではなく下記 scope 欄で対応する）
conditions:
  - WHEN
  - IF
  - WHILE
  - BEFORE
  - AFTER

# 適用範囲（Scope。EARSのWhere=機能スコープに対応）
# ※SSOT訂正（2026-08-05, Step E）: 本構文はPhase 2から全層実装・Corpus採録済み
#   （SEND-002）だったが、本ファイルへの宣言が欠落していた。挙動変更はないため
#   profile_versionは据え置き（宣言の追補）。
scope:
  japanese_form: "〈機能名〉において、"      # 文頭。機能名は用語辞書のfunction型
  english_form: 'For "〈Function〉",'
  canonical_path: /rimay_core/scope/function
  term_type: function                        # 未登録語はJP-LEXICAL

# MVP対象のモダリティ（許可・能力・推奨は拡張プロファイル、Profile外）
modalities:
  - MUST
  - MUST_NOT

# MVP対象のAction 10種（lexicon/case-frames.yaml と対応）
# family = 概念ID（Rule・質問・知識ルーティングが参照）
# rimay_action_id = 既存Rimay Grammar上の規則名（English Rimay Serializer専用）
# 対応の根拠: reports/compatibility/rimay-grammar-inventory.yaml の mvp_action_mapping
action_classes:
  - {family: CREATE,    rimay_action_id: ENGENDER_27}
  - {family: STORE,     rimay_action_id: KEEP_15_2}
  - {family: SEND,      rimay_action_id: SEND_11_1_1}
  - {family: RECEIVE,   rimay_action_id: OBTAIN_13_5_2}
  - {family: DISPLAY,   rimay_action_id: REFLEXIVE_APPEARANCE_48_1_2}  # 0.2.0: D7 R-1/CG-09是正。SEE_30_1_1（detect専用）はProfile外の独立候補としてevidence matrixに保持
  - {family: UPDATE,    rimay_action_id: DS_UPDATE}
  - {family: DELETE,    rimay_action_id: REMOVE_10_1}
  - {family: VERIFY,    rimay_action_id: DS_VALIDATE}
  - {family: CALCULATE, rimay_action_id: CREATE_26_4}
  - {family: NOTIFY,    rimay_action_id: SAY_37_7}

# Canonical表現規則（第2回レビューP0裁定、構想書 §5）
canonical_contract:
  canonical_pointer: rfc6901-single-node  # resolution.slotsキー/provenance.path/Patch path/質問target_path/finding対象
  rule_selector: rfc6901-pattern          # '*'許可。Ruleマッチング専用。Engineが単一Pointerへ展開
  unknown_representation: no-value-plus-status  # unknownを値として格納しない
  inline_slot_objects: forbidden  # value/status/provenanceのフィールド内埋め込み禁止
  slot_status_granularity: leaf   # 複合オブジェクトの状態は子スロットから導出（保存しない）
  implicit_confirmed: forbidden   # resolution.slotsにないスロットは未評価扱い
  revision_optimistic_lock: true  # Patchはbase_revision必須。不一致は競合拒否

# 要求全体の状態機械（構想書 §5）
requirement_statuses:
  - candidate
  - under_clarification
  - structurally_valid
  - review_ready
  - approved
  - superseded
  - rejected

# 記述規則（Normalizer・Validatorが強制する）
rules:
  - subject_omission_prohibited      # 主体・対象の省略禁止
  - one_primary_response_per_requirement  # 1文1主要応答
  - registered_terms_only            # 登録済み用語のみ

# Canonical Requirement の構成領域
canonical_sections:
  - rimay_core
  - extensions
  - resolution
  - provenance

# スロット確定状態（unknown は null・欠落と区別する）
slot_status:
  - unknown
  - proposed
  - confirmed
  - not_applicable

# 用語辞書の目標規模
terms_target:
  min: 100
  max: 300

# 業務知識の目標規模（v0.3 README「Supported Profile（MVP）」）
business_rules_target:
  min: 10
  max: 30
state_models_target:
  min: 1
  max: 3
