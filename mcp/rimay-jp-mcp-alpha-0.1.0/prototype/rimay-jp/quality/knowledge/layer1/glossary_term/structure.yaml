# Layer 1 segment schema — glossary term / definition (ISO 704). Analyst-asserted grounding (FR-046).
# No detection (FR-004). Validated by schemas/layer1-structure.v2.schema.json.
version: "1.0.0"
artifact_type: glossary_term
source_id: glossary/iso-704-0000
segments:
  - {id: term, name: Term, required: true, description: "Mandatory. The defined term (designation)."}
  - {id: definition, name: Definition, required: true, description: "Mandatory. A single, non-circular definition of the term."}
ordering: [term, definition]
quality_attributes:
  - {id: non_circular, description: "The definition does not refer to the term itself."}
  - {id: single_sense, description: "Exactly one definition per term (no conflicting senses)."}
  - {id: consistency, description: "The term is used consistently across requirements."}
enumerations:
  definition_rules:
    - {id: non_circular, description: "Definition must not contain the term being defined."}
    - {id: single_sense, description: "A term has one authoritative definition."}
