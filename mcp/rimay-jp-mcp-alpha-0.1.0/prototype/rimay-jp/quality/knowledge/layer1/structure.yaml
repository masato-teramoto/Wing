# Layer 1 — Requirement Structure (Rimay-derived). Data, not code (FR-031).
# Contains NO smell-detection logic (FR-004). Validated by schemas/layer1-structure.schema.json.
version: "1.0.0"
source:
  document: "Automated Smell Detection and Recommendation in NL Requirements (Veizaga, Shin & Briand, 2023; arXiv:2305.07097)"
  locator: "§2 Controlled Natural Language: Rimay; Listing 1; Fig. 1; Table 5"

segments:
  - id: scope
    name: Scope
    required: false
    description: "Optional. Delimits the effect of the system response, e.g. 'For each \"Text\"'."
  - id: condition
    name: Condition
    required: false
    description: "Optional. The state/trigger/time under which the response is invoked."
  - id: actor
    name: Actor
    required: true
    description: "Mandatory. The role/entity that achieves the system response."
  - id: modal_verb
    name: Modal verb
    required: true
    description: "Mandatory. e.g. 'must' / 'shall'. Not allowed inside conditions."
  - id: system_response
    name: System response
    required: true
    description: "Mandatory. The single action the actor performs (action phrase)."

ordering: [scope, condition, system_response]

quality_attributes:
  - id: completeness
    description: "All required information is present (actor, modal verb, system response)."
  - id: clarity
    description: "Phrases and words are free of ambiguity."
  - id: atomicity
    description: "The requirement describes a single system function."
  - id: correctness
    description: "Words and phrases are arranged in the correct, standard order."

atomicity_rule: "A requirement MUST have exactly one system response."

condition_types:
  - id: when
    name: When (trigger)
    description: "A specific triggering event is detected in the system."
  - id: if
    name: If (precondition/trigger)
    description: "A precondition holds, or a triggering event happens, before the response."
  - id: while
    name: While (state)
    description: "The system is in one or more specific states."
  - id: where
    name: Where (feature)
    description: "The system includes particular features (free-form text)."
  - id: temporal
    name: Temporal (before/after/every)
    description: "The response is triggered before/after/every a temporal event."

patterns:
  - id: P1
    name: Scope and system response
    shape: "For each|all ... \"Text\", the? Actor must <Action>."
    segments: [scope, system_response]
  - id: P2
    name: Scope, condition (precondition), and system response
    shape: "For each ... \"Text\", if <Property> is ... \"Value\", then the? Actor must <Action>."
    segments: [scope, condition, system_response]
  - id: P3
    name: Scope, condition (trigger), and system response
    shape: "For each ... \"Text\", when the? Actor <Action>, then the? Actor must <Action>."
    segments: [scope, condition, system_response]
  - id: P4
    name: Scope, condition (time), and system response
    shape: "For each ... \"Text\", after|before \"Text\", then the? Actor must <Action>."
    segments: [scope, condition, system_response]
  - id: P5
    name: System response
    shape: "The? Actor must <Action>."
    segments: [system_response]
  - id: P6
    name: Condition (precondition) and system response
    shape: "If <Property> is ... \"Value\", then the? Actor must <Action>."
    segments: [condition, system_response]
  - id: P7
    name: Condition (trigger) and system response
    shape: "When the? Actor <Action>, then the? Actor must <Action>."
    segments: [condition, system_response]
  - id: P8
    name: Condition (time) and system response
    shape: "After|Before \"Text\", then the? Actor must <Action>."
    segments: [condition, system_response]
  - id: P9
    name: Scope, multiple conditions, and system response
    shape: "For each ... \"Text\", if <Property> is ... \"Value\", and when the? Actor <Action>, then the? Actor must <Action>."
    segments: [scope, condition, system_response]
  - id: P10
    name: Multiple conditions and system response
    shape: "If <Property> is ... \"Value\", and when the? Actor <Action>, then the? Actor must <Action>."
    segments: [condition, system_response]
