# Layer 1 segment schema — user story (QUS / Connextra). No detection (FR-004).
# Validated by schemas/layer1-structure.v2.schema.json.
version: "1.0.0"
artifact_type: user_story
source_id: user_story/lucassen-2016
segments:
  - {id: role, name: Role, required: true, description: "Mandatory. Who the story is for ('As a <role>')."}
  - {id: goal, name: Goal, required: true, description: "Mandatory. What is wanted ('I want <goal>')."}
  - {id: benefit, name: Benefit, required: false, description: "Optional (zero or more ends). Why ('so that <benefit>')."}
ordering: [role, goal, benefit]
quality_attributes:
  - {id: well_formed, description: "Has at least a role and a means (goal) in the Connextra format."}
  - {id: atomic, description: "Expresses one feature, not several."}
  - {id: minimal, description: "Contains role/means/(ends) and nothing extraneous."}
enumerations:
  invest_attributes:
    - {id: independent, name: Independent, description: "Self-contained; minimal dependencies."}
    - {id: negotiable, name: Negotiable, description: "Not an over-specified contract."}
    - {id: valuable, name: Valuable, description: "Delivers value to the role."}
    - {id: estimable, name: Estimable, description: "Can be sized."}
    - {id: small, name: Small, description: "Fits within an iteration."}
    - {id: testable, name: Testable, description: "Has verifiable acceptance criteria."}
