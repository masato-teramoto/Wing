# Layer 1 segment schema — non-functional requirement (Quality Attribute Scenario, QAS).
# Analyst-asserted grounding (FR-046); no detection (FR-004). Validated by layer1-structure.v2.schema.json.
version: "1.0.0"
artifact_type: non_functional
source_id: nfr/qas-0000
segments:
  - {id: source, name: Source, required: true, description: "Mandatory. Entity that generates the stimulus (user, system, sensor)."}
  - {id: stimulus, name: Stimulus, required: true, description: "Mandatory. The condition arriving at the system."}
  - {id: environment, name: Environment, required: false, description: "Optional. Operating mode/conditions when the stimulus occurs."}
  - {id: artifact, name: Artifact, required: true, description: "Mandatory. The part of the system stimulated."}
  - {id: response, name: Response, required: true, description: "Mandatory. The activity undertaken in response."}
  - {id: response_measure, name: Response measure, required: true, description: "Mandatory. The MEASURABLE target for the response (its absence is the core NFR smell)."}
ordering: [source, stimulus, environment, artifact, response, response_measure]
quality_attributes:
  - {id: measurability, description: "Carries a quantified, verifiable response_measure."}
  - {id: completeness, description: "Source, stimulus, artifact, response, and measure all present."}
  - {id: clarity, description: "Quality attribute and target are unambiguous."}
enumerations:
  quality_characteristics:
    - {id: performance_efficiency, name: Performance efficiency}
    - {id: security, name: Security}
    - {id: reliability, name: Reliability}
    - {id: usability, name: Usability}
    - {id: maintainability, name: Maintainability}
    - {id: compatibility, name: Compatibility}
    - {id: portability, name: Portability}
