id: glossary_circular_definition
name: 循環定義
artifact_type: glossary_term
language: ja
quality_attribute: non_circular
definition: >
  用語の定義は循環してはならない（定義文の中で定義対象の用語自身を用いてはならない）。
  「用語：定義」の項目で、定義に用語が含まれる場合は循環定義である。
definition_source_id: glossary/iso-704-0000
method_source_id: glossary/arora-2017
detection_basis:
  description: "全角コロン「：」で用語と定義を分割し、定義中に用語が部分一致するかで判定する。"
  source_id: japanese/seki-2019
implementable: deterministic
detector:
  type: term_definition
  params:
    separators: ["：", ":"]
default_severity: medium
explanation_template: "定義が用語「{match}」を用いて記述されています。用語自身を使わずに定義してください。"
examples:
  positive:
    - "セッション：セッションとは利用者の活動期間である。"
  negative:
    - "セッション：ログアウトで終了する利用者の連続的な活動期間。"
