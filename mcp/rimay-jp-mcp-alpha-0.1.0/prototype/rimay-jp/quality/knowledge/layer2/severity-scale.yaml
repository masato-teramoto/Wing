# Severity scale (FR-013). Closed set {high, medium, low} with a documented, justified
# default per smell. The source assigns no fixed severity (it notes passive voice alone is
# not necessarily a direct defect cause — §1), so defaults are this asset's design decision.
version: "1.0.0"
levels: [high, medium, low]
defaults:
  non_atomic_requirement:
    severity: high
    justification: "Multiple actions in one requirement break atomicity and verifiability."
  incomplete_requirement:
    severity: high
    justification: "A missing system response leaves the requirement non-actionable."
  incorrect_order_requirement:
    severity: high
    justification: "A condition after the response makes interpretation vague and error-prone."
  coordination_ambiguity:
    severity: medium
    justification: "An 'or' between conditions is ambiguous but the intent is often recoverable."
  not_a_requirement:
    severity: high
    justification: "A statement with no requirement segment is not a requirement at all."
  incomplete_condition:
    severity: high
    justification: "A condition missing actor or verb is incomplete and ambiguous."
  incomplete_system_response:
    severity: high
    justification: "A response missing actor, modal, or verb is incomplete."
  passive_voice:
    severity: low
    justification: "Per the source, passive voice alone is not necessarily a direct defect cause."
  not_precise_verb:
    severity: medium
    justification: "A vague verb is hard to test but the requirement is otherwise well-formed."
