id: ac_not_ears_conformant
name: Acceptance criterion not EARS-conformant
artifact_type: acceptance_criteria
language: en
quality_attribute: clarity
definition: >
  An acceptance criterion must state a system response with an EARS response operator
  ('shall' / 'must'), optionally introduced by a pattern keyword (When/While/Where/If).
  A criterion with no response operator does not conform to an EARS pattern.
definition_source_id: acceptance/mavin-2009   # EARS (notation tier)
method_source_id: general/arora-2015          # paper-tier template-conformance method (FR-040)
implementable: deterministic
detector:
  type: ears_pattern
  params: {}
default_severity: medium
explanation_template: "Criterion lacks an EARS response operator ('shall'/'must'); rewrite per an EARS pattern."
examples:
  positive:
    - "When the user clicks save, the file is stored."
  negative:
    - "When the user clicks save, the system shall store the file."
    - "The system shall encrypt all data at rest."
