id: constraint_modality_not_wellformed
name: 制約の義務表現が整形式でない
artifact_type: constraint
language: ja
quality_attribute: clarity
definition: >
  業務ルール・制約は明示的な義務表現（義務・禁止・許可）を持たなければならない。
  義務表現がない、または弱い/曖昧な表現のみの記述は整形式の制約ではない。
definition_source_id: constraint/sbvr-2019
method_source_id: general/arora-2015
detection_basis:
  description: "日本語の義務・禁止・許可の助動詞表現の有無で判定する。"
  source_id: japanese/seki-2019
implementable: deterministic
detector:
  type: modality
  params:
    modals: [してはならない, しなければならない, してもよい, なければならない, 禁止する, 許可する]
    weak: [すべき, 望ましい, 推奨する]
default_severity: medium
explanation_template: "制約の義務表現が{match}です。明示的な義務・禁止・許可（「〜しなければならない」「〜してはならない」等）を記述してください。"
examples:
  positive:
    - "ベンダーは返金を処理する。"
  negative:
    - "ベンダーはカード番号を保存してはならない。"
