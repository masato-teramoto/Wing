id: incomplete_condition
name: Incomplete condition
language: ja
quality_attribute: completeness
definition: See catalog/source for the definition of 'Incomplete condition'.
citation:
  document: Automated Smell Detection and Recommendation in NL Requirements (Veizaga,
    Shin & Briand, 2023; arXiv:2305.07097)
  locator: '§4.1 Table 3 (Incomplete condition); §5.3 Tregex IC1/IC2; structural patterns
    #9-11'
detector:
  type: completeness
  params:
    check: condition
default_severity: high
explanation_template: The condition is missing an actor or a verb; state who does
  what.
examples:
  positive:
  - 受信したとき、System-Aは状態を更新しなければならない。
  negative:
  - System-Aがメッセージを受信したとき、System-Aは状態を更新しなければならない。
detection_basis:
  description: 条件節（〜とき）にアクター（〜は/が）または動詞が欠けていることを判定する。
  citation: Japanese detection basis for arXiv:2305.07097; organization review
