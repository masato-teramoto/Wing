id: incomplete_requirement
name: Incomplete requirement
language: en
quality_attribute: completeness
definition: See catalog/source for the definition of 'Incomplete requirement'.
citation:
  document: Automated Smell Detection and Recommendation in NL Requirements (Veizaga,
    Shin & Briand, 2023; arXiv:2305.07097)
  locator: §4.1 Table 3 (Incomplete requirement); §5.3 Rules
detector:
  type: segment_count
  params:
    check: incomplete_requirement
default_severity: high
explanation_template: This requirement has a condition or scope but no system response;
  add the missing action.
examples:
  positive:
  - When System-A receives a message from the security manager and the message is
    part of the B-file.
  negative:
  - When System-A receives a message, System-A must store the message.
