id: not_precise_verb
name: Not a precise verb
language: en
quality_attribute: clarity
definition: See catalog/source for the definition of 'Not a precise verb'.
citation:
  document: Automated Smell Detection and Recommendation in NL Requirements (Veizaga,
    Shin & Briand, 2023; arXiv:2305.07097)
  locator: §4.1 Table 3 (Not precise verb); §5.3 Glossary search
detector:
  type: glossary
  params:
    glossary_ref: glossaries/vague-verbs.en.yaml
    segments:
    - condition
    - system_response
default_severity: medium
explanation_template: The verb '{match}' is not precise enough to be testable; use
  a specific action (e.g., validate, send, store).
examples:
  positive:
  - System-A must process the instruction.
  negative:
  - System-A must store the instruction.
