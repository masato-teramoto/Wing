  - System-Aがメッセージを受信したとき。
  negative:
  - System-Aがメッセージを受信したとき、System-Aはそれを保存しなければならない。
detection_basis:
  description: 条件（とき/場合 等）はあるが「〜しなければならない」等のシステム応答が無いことを判定する。
  citation: Japanese detection basis for arXiv:2305.07097; organization review
