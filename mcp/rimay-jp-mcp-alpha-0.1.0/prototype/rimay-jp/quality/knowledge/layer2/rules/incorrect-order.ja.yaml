id: incorrect_order_requirement
name: Incorrect order requirement
language: ja
quality_attribute: correctness
definition: See catalog/source for the definition of 'Incorrect order requirement'.
citation:
  document: Automated Smell Detection and Recommendation in NL Requirements (Veizaga,
    Shin & Briand, 2023; arXiv:2305.07097)
  locator: §4.1 Table 3 (Incorrect order requirement); §5.3 Rules
detector:
  type: segment_count
  params:
    check: incorrect_order
default_severity: high
explanation_template: A condition appears after the system response; reorder so conditions
  precede the response.
examples:
  positive:
  - System-Aはアラートを表示しなければならない、System-Aが起動したとき。
  negative:
  - System-Aが起動したとき、System-Aはアラートを表示しなければならない。
detection_basis:
  description: 条件節（〜とき）がシステム応答の後ろに置かれていることを判定する。
  citation: Japanese detection basis for arXiv:2305.07097; organization review
