id: incomplete_system_response
name: Incomplete system response
language: ja
quality_attribute: completeness
definition: See catalog/source for the definition of 'Incomplete system response'.
citation:
  document: Automated Smell Detection and Recommendation in NL Requirements (Veizaga,
    Shin & Briand, 2023; arXiv:2305.07097)
  locator: '§4.1 Table 3 (Incomplete system response); §5.3 structural patterns #12-14'
detector:
  type: completeness
  params:
    check: system_response
default_severity: high
explanation_template: The system response is missing an actor, a modal verb, or a
  verb.
examples:
  positive:
  - ユーザーがボタンをクリックしたとき、System-Aはフィルター画面を開く。
  negative:
  - ユーザーがボタンをクリックしたとき、System-Aはフィルター画面を開かなければならない。
detection_basis:
  description: システム応答に助動詞相当（〜しなければならない）・アクター・又は動詞が欠けていることを判定する。
  citation: Japanese detection basis for arXiv:2305.07097; organization review
