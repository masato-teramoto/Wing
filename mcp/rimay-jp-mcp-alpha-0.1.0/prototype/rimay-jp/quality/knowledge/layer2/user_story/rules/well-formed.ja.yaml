id: us_not_well_formed
name: ユーザーストーリーが整形式でない
artifact_type: user_story
language: ja
quality_attribute: well_formed
definition: >
  ユーザーストーリーは役割（「〜として」）と目的（「〜したい」）を備えていなければならない。
  役割または目的を欠くストーリーは整形式ではない（AQUSA 構文基準）。
definition_source_id: user_story/lucassen-2016
detection_basis:
  description: "日本語の定型（「〜として」「〜したい」）の有無を表層パターンで判定する。"
  source_id: japanese/seki-2019
implementable: deterministic
detector:
  type: story_template
  params:
    role_pattern: "として"
    means_pattern: "(したい|してほしい|欲しい|ほしい)"
default_severity: medium
explanation_template: "ユーザーストーリーが{match}です。『〈役割〉として、〈目的〉したい（、〈価値〉のために）』の形式で記述してください。"
examples:
  positive:
    - "ログインしたい。"
  negative:
    - "利用者として、ログインしたい。"
    - "利用者として、買い物ができるようにログインしたい。"
