id: us_not_well_formed
name: User story not well-formed
artifact_type: user_story
language: en
quality_attribute: well_formed
definition: >
  A user story must follow the Connextra template with at least a role ("As a <role>") and a
  means ("I want <goal>"). A story missing the role or the means is not well-formed (AQUSA syntactic).
definition_source_id: user_story/lucassen-2016
implementable: deterministic
detector:
  type: story_template
  params: {}
default_severity: medium
explanation_template: "User story is {match}; use 'As a <role>, I want <goal>[, so that <benefit>]'."
examples:
  positive:
    - "I want to log in."
    - "As an admin, the report is exported."
  negative:
    - "As a user, I want to log in."
    - "As a user, I want to log in so that I can place an order."
