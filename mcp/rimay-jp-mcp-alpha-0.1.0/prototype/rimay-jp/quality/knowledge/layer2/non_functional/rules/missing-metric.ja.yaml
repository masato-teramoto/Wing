id: nfr_missing_measurable_metric
name: 測定可能な指標のない品質目標
artifact_type: non_functional
language: ja
quality_attribute: measurability
definition: >
  非機能要件は測定可能な指標（response_measure、定量的な目標値）を持たなければならない。
  測定可能な指標のない品質目標は検証できない（中心的な非機能要件スメル）。
definition_source_id: nfr/qas-0000
method_source_id: nfr/eckhardt-2016
detection_basis:
  description: "定量値（数値）の有無で判定する言語非依存の検査。"
  source_id: japanese/seki-2019
implementable: deterministic
detector:
  type: metric_presence
  params: {}
default_severity: high
explanation_template: "測定可能な目標値がありません。定量的な指標を追加してください（例：『200ミリ秒以内』『99.9%の可用性』）。"
examples:
  positive:
    - "システムは高速でなければならない。"
  negative:
    - "95%の検索リクエストは200ミリ秒以内に完了しなければならない。"
