# MVPオーケストレーション規則（構想書 §26.4 の3C対象サブセット）
# orchestration-rule.schema.json に適合すること（runner3cがCI上で検証する）。
# 実行順序: stage（列挙順）→ priority（小さいほど先）→ Rule ID辞書順
# 0.2.0: 必須Role第一目的語系（theme／content／result）のASK_USER規則を追加
# （holdout増補HG-011〜014が質問未計画を検出→本追加。継続条件③）
rule_set_version: 0.2.0
profile_version: rimay-jp-mvp-0.1.0

rules:
  # ---- 1. structural_completion: 必須スロットの充足 ----
  - id: RULE-ACTOR-001
    stage: structural_completion
    priority: 10
    trigger: [normalize_completed, slot_updated]
    execution_mode: monitor
    when:
      all:
        - {status_at: /rimay_core/response/actor, op: equals, value: unknown}
    action:
      type: ASK_USER
      target_selector: /rimay_core/response/actor
      question_template: この動作を実行するシステム（応答主体）はどれですか。
    done_when:
      any:
        - {status_at: /rimay_core/response/actor, op: in, value: [confirmed, not_applicable]}

  - id: RULE-EVENT-ACTOR-001
    stage: structural_completion
    priority: 11
    trigger: [normalize_completed, slot_updated]
    execution_mode: monitor
    when:
      all:
        - {status_at: /rimay_core/conditions/*/event/actor, op: equals, value: unknown}
    action:
      type: ASK_USER
      target_selector: /rimay_core/conditions/*/event/actor
      question_template: トリガー条件の主体（誰が・どのシステムが）は何ですか。
    done_when:
      any:
        - {status_at: /rimay_core/conditions/*/event/actor, op: in, value: [confirmed, not_applicable]}

  - id: RULE-MODALITY-001
    stage: structural_completion
    priority: 12
    trigger: [normalize_completed, slot_updated]
    execution_mode: monitor
    when:
      all:
        - {status_at: /rimay_core/response/modality, op: equals, value: unknown}
    action:
      type: ASK_USER
      target_selector: /rimay_core/response/modality
      question_template: この要求は必須（〜しなければならない）ですか、禁止（〜してはならない）ですか。
    done_when:
      any:
        - {status_at: /rimay_core/response/modality, op: in, value: [confirmed, not_applicable]}

  - id: RULE-SEND-DEST-001
    stage: structural_completion
    priority: 20
    trigger: [slot_updated, validation_completed]
    execution_mode: monitor
    when:
      all:
        - {value_at: /rimay_core/response/action/family, op: equals, value: SEND}
        - {status_at: /rimay_core/response/destination, op: equals, value: unknown}
    action:
      type: ASK_USER
      target_selector: /rimay_core/response/destination
      question_template: 送信先を指定してください。
    done_when:
      any:
        - {status_at: /rimay_core/response/destination, op: in, value: [confirmed, not_applicable]}

  - id: RULE-DEST-CONFIRM-001
    stage: structural_completion
    priority: 21
    trigger: [slot_updated, validation_completed]
    execution_mode: monitor
    when:
      all:
        - {status_at: /rimay_core/response/destination, op: equals, value: proposed}
        - {meta_at: /rimay_core/response/destination, op: confirmation_required, value: true}
    action:
      type: ASK_USER
      target_selector: /rimay_core/response/destination
      question_template: 宛先が抽象的です。具体的な送信先（メールアドレス等の属性またはシステム）を指定してください。
    done_when:
      any:
        - {status_at: /rimay_core/response/destination, op: in, value: [confirmed, not_applicable]}

  - id: RULE-UPDATE-VALUE-001
    stage: structural_completion
    priority: 22
    trigger: [slot_updated, validation_completed]
    execution_mode: monitor
    when:
      all:
        - {value_at: /rimay_core/response/action/family, op: equals, value: UPDATE}
        - {status_at: /rimay_core/response/result_value, op: equals, value: unknown}
    action:
      type: ASK_USER
      target_selector: /rimay_core/response/result_value
      question_template: 更新後の値を指定してください。
    done_when:
      any:
        - {status_at: /rimay_core/response/result_value, op: in, value: [confirmed, not_applicable]}

  - id: RULE-DISPLAY-LOC-001
    stage: structural_completion
    priority: 23
    trigger: [slot_updated, validation_completed]
    execution_mode: monitor
    when:
      all:
        - {value_at: /rimay_core/response/action/family, op: equals, value: DISPLAY}
        - {status_at: /rimay_core/response/display_location, op: equals, value: unknown}
    action:
      type: ASK_USER
      target_selector: /rimay_core/response/display_location
      question_template: 表示先（画面等）を指定してください。
    done_when:
      any:
        - {status_at: /rimay_core/response/display_location, op: in, value: [confirmed, not_applicable]}

  # §26.4のMVP規則のうち未実装だった必須Role質問（Phase 4整備時に追加、変更管理は§25.3）
  - id: RULE-STORE-LOC-001
    stage: structural_completion
    priority: 24
    trigger: [slot_updated, validation_completed]
    execution_mode: monitor
    when:
      all:
        - {value_at: /rimay_core/response/action/family, op: equals, value: STORE}
        - {status_at: /rimay_core/response/location, op: equals, value: unknown}
    action:
      type: ASK_USER
      target_selector: /rimay_core/response/location
      question_template: 保存先を指定してください。
    done_when:
      any:
        - {status_at: /rimay_core/response/location, op: in, value: [confirmed, not_applicable]}

  - id: RULE-VERIFY-RULE-001
    stage: structural_completion
    priority: 25
    trigger: [slot_updated, validation_completed]
    execution_mode: monitor
    when:
      all:
        - {value_at: /rimay_core/response/action/family, op: equals, value: VERIFY}
        - {status_at: /rimay_core/response/rule, op: equals, value: unknown}
    action:
      type: ASK_USER
      target_selector: /rimay_core/response/rule
      question_template: 判定規則（何に基づいて検証するか）を指定してください。
    done_when:
      any:
        - {status_at: /rimay_core/response/rule, op: in, value: [confirmed, not_applicable]}

  - id: RULE-NOTIFY-DEST-001
    stage: structural_completion
    priority: 26
    trigger: [slot_updated, validation_completed]
    execution_mode: monitor
    when:
      all:
        - {value_at: /rimay_core/response/action/family, op: equals, value: NOTIFY}
        - {status_at: /rimay_core/response/destination, op: equals, value: unknown}
    action:
      type: ASK_USER
      target_selector: /rimay_core/response/destination
      question_template: 通知先を指定してください。
    done_when:
      any:
        - {status_at: /rimay_core/response/destination, op: in, value: [confirmed, not_applicable]}

  - id: RULE-RECEIVE-SRC-001
    stage: structural_completion
    priority: 27
    trigger: [slot_updated, validation_completed]
    execution_mode: monitor
    when:
      all:
        - {value_at: /rimay_core/response/action/family, op: equals, value: RECEIVE}
        - {status_at: /rimay_core/response/source, op: equals, value: unknown}
    action:
      type: ASK_USER
      target_selector: /rimay_core/response/source
      question_template: 受信元（送信元システム）を指定してください。
    done_when:
      any:
        - {status_at: /rimay_core/response/source, op: in, value: [confirmed, not_applicable]}

  - id: RULE-CALC-INPUT-001
    stage: structural_completion
    priority: 28
    trigger: [slot_updated, validation_completed]
    execution_mode: monitor
    when:
      all:
        - {value_at: /rimay_core/response/action/family, op: equals, value: CALCULATE}
        - {status_at: /rimay_core/response/input, op: equals, value: unknown}
    action:
      type: ASK_USER
      target_selector: /rimay_core/response/input
      question_template: 算出の入力（何から算出するか）を指定してください。
    done_when:
      any:
        - {status_at: /rimay_core/response/input, op: in, value: [confirmed, not_applicable]}

  - id: RULE-THEME-001
    stage: structural_completion
    priority: 29
    trigger: [slot_updated, validation_completed]
    execution_mode: monitor
    when:
      all:
        - {value_at: /rimay_core/response/action/family, op: in,
           value: [SEND, CREATE, STORE, RECEIVE, DISPLAY, DELETE, VERIFY]}
        - {status_at: /rimay_core/response/theme, op: equals, value: unknown}
    action:
      type: ASK_USER
      target_selector: /rimay_core/response/theme
      question_template: 動作の対象（何を処理するか）を指定してください。
    done_when:
      any:
        - {status_at: /rimay_core/response/theme, op: in, value: [confirmed, not_applicable]}

  - id: RULE-NOTIFY-CONTENT-001
    stage: structural_completion
    priority: 30
    trigger: [slot_updated, validation_completed]
    execution_mode: monitor
    when:
      all:
        - {value_at: /rimay_core/response/action/family, op: equals, value: NOTIFY}
        - {status_at: /rimay_core/response/content, op: equals, value: unknown}
    action:
      type: ASK_USER
      target_selector: /rimay_core/response/content
      question_template: 通知内容（何を知らせるか）を指定してください。
    done_when:
      any:
        - {status_at: /rimay_core/response/content, op: in, value: [confirmed, not_applicable]}

  - id: RULE-CALC-RESULT-001
    stage: structural_completion
    priority: 31
    trigger: [slot_updated, validation_completed]
    execution_mode: monitor
    when:
      all:
        - {value_at: /rimay_core/response/action/family, op: equals, value: CALCULATE}
        - {status_at: /rimay_core/response/result, op: equals, value: unknown}
    action:
      type: ASK_USER
      target_selector: /rimay_core/response/result
      question_template: 算出結果（何を算出するか）を指定してください。
    done_when:
      any:
        - {status_at: /rimay_core/response/result, op: in, value: [confirmed, not_applicable]}

  # ---- 2. semantic_disambiguation: 意味を分岐させる曖昧性 ----
  - id: RULE-VERB-AMBIGUOUS-001
    stage: semantic_disambiguation
    priority: 10
    trigger: [normalize_completed, slot_updated]
    execution_mode: monitor
    when:
      all:
        - {meta_at: /rimay_core/response/action/family, op: candidate_count_greater_than, value: 1}
    action:
      type: ASK_ACTION_MEANING
      target_selector: /rimay_core/response/action/family
      question_template: この動作の意味はどれですか（候補から選択してください）。
    done_when:
      any:
        - {status_at: /rimay_core/response/action/family, op: in, value: [confirmed, not_applicable]}

  - id: RULE-VERB-CONFIRM-001
    stage: semantic_disambiguation
    priority: 20
    trigger: [normalize_completed, slot_updated]
    execution_mode: monitor
    when:
      all:
        - {status_at: /rimay_core/response/action/family, op: equals, value: proposed}
        - not:
            {meta_at: /rimay_core/response/action/family, op: candidate_count_greater_than, value: 1}
    action:
      type: ASK_ACTION_MEANING
      target_selector: /rimay_core/response/action/family
      question_template: 抽出した動作の解釈で正しいですか（標準動詞で確認してください）。
    done_when:
      any:
        - {status_at: /rimay_core/response/action/family, op: in, value: [confirmed, not_applicable]}

  - id: RULE-ACTION-ID-001
    stage: semantic_disambiguation
    priority: 30
    trigger: [slot_updated]
    execution_mode: repeatable
    when:
      all:
        - {status_at: /rimay_core/response/action/family, op: equals, value: confirmed}
        - {status_at: /rimay_core/response/action/rimay_action_id, op: equals, value: unknown}
    action:
      type: APPLY_PROFILE_MAPPING
      target_selector: /rimay_core/response/action/rimay_action_id
    rationale: rimay_action_idはSupported Profileの確定規則（family対応表）から自動補完できる表記事項であり、人間確認を要しない。

  # ---- 6. downstream_generation: 承認済み要求からの下流生成 ----
  - id: RULE-ACCEPTANCE-001
    stage: downstream_generation
    priority: 10
    trigger: [status_changed]
    execution_mode: once
    when:
      all:
        - {value_at: /status, op: equals, value: approved}
    action:
      type: GENERATE_ACCEPTANCE_CRITERIA
    rationale: 受入基準は承認済み（approved）要求だけを対象とする（§21 Phase 3E）。

  - id: RULE-TESTGEN-001
    stage: downstream_generation
    priority: 20
    trigger: [status_changed]
    execution_mode: once
    when:
      all:
        - {value_at: /status, op: equals, value: approved}
    action:
      type: GENERATE_TEST_CANDIDATES
    rationale: テスト候補生成もapproved要求のみを対象とする。

  # ---- 5. quality_constraint: 品質・非機能制約 ----
  - id: RULE-VAGUE-001
    stage: quality_constraint
    priority: 10
    trigger: [normalize_completed, slot_updated]
    execution_mode: monitor
    when:
      all:
        - {status_at: /extensions/time_constraints/*/value, op: equals, value: unknown}
    action:
      type: ASK_MEASURABLE_CRITERIA
      target_selector: /extensions/time_constraints/*/value
      question_template: 時間条件を測定可能な形で指定してください（例：60秒以内）。
    done_when:
      any:
        - {status_at: /extensions/time_constraints/*/value, op: in, value: [confirmed, not_applicable]}
