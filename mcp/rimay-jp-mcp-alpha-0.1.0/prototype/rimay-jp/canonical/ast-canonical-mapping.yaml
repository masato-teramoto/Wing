# AST ⇔ Canonical rimay_core 対応表 v0.1（Phase 1成果物、構想書v0.5 §13.3）
# 方向: canonicalize(AST) → rimay_core（射影意味等価検査の右辺を定義する）
# AST規則名は reports/compatibility/rimay-grammar-inventory.yaml（Phase 0調査）に基づく。
# 既存実装コードは参照のみ（ライセンス未設定）。規則の統語構造はCC BY 4.0の論文付録を一次ソースとする。
# 0.1.1: RECEIVE/NOTIFYへCHANNEL_THROUGH追記（case-frames.yamlのoptional_roles宣言と
# の乖離をholdout増補HN-034が検出。SENDのみ宣言されていた）
mapping_version: 0.5.0   # 0.5.0: legacy subjectとtyped Operator operand authority（RC-094）
profile_version: rimay-jp-mvp-0.5.0

# ---- 構造対応 ----
structure:
  - ast_rule: Requirement          # (Scope)? (WithoutCondition|WithCondition) '.'
    canonical: /
  - ast_rule: Scope                # 'For' ScopeText ','
    canonical: /rimay_core/scope/function
    note: ScopeTextの引用文字列を用語IDへ正規化して比較する
  - ast_rule: WithoutCondition
    canonical: /rimay_core/conditions
    note: 空配列に対応
  - ast_rule: WithCondition        # ConditionStructure+ ',' ('then')? SystemResponse
    canonical: /rimay_core/conditions
  - ast_rule: SystemResponse       # (article)? Actor ModalVerb ResponseBlock
    canonical: /rimay_core/response
    fields:
      system_name: /rimay_core/response/actor
      modal_verb: /rimay_core/response/modality
  - ast_rule: AtomicSystemResponse # (ModalVerb)? (not)? ActionPhrase
    canonical: /rimay_core/response/modality
    note: "'not'があればMUST_NOTへ正規化（must not / shall not）"

# ---- 条件対応（Supported Profile v0.1の5種） ----
conditions:
  - ast_rule: WhenStructure        # 'When' (Trigger|FreeExpression)
    condition_type: WHEN
    fields:
      trigger.actor: event/actor
      trigger.actions: event/action, event/object
    note: FreeExpression分岐はFREE-TEXT findingとして記録
  - ast_rule: IfStructure          # 'If' (PreconditionStructure|Trigger)
    condition_type: IF
    fields:
      preconditions: predicate（legacy subjectまたはtyped operand＋operator＋value authority）
    operator_contract: [IS, EQUALS, NOT_EQUALS, GREATER_THAN, LESS_THAN, GREATER_OR_EQUAL, LESS_OR_EQUAL, CONTAINS]
    value_expression_contract:
      canonical: predicate/value_expression
      kinds: [value, group, and, or]
      connectors: {and: AND, or: OR}
      binary_form: fully_parenthesized
      scalar_lifting: forbidden
    operator_value_expression_contract:
      canonical: predicate/operand
      identity_authority: [legacy_subject, typed_operand]
      wrappers: [declared_reference, instance_or_property, ui_component_instance]
      declared_reference_kinds: [actor, class, property]
      typed_operand_requires: value_expression
      automatic_subject_typing: forbidden
      class_gap_synthesis: forbidden
      repository_mapping: preserved_only
    classification: rimay_jp_extension
  - ast_rule: WhileStructure       # 'While' PreconditionStructure
    condition_type: WHILE
    fields:
      preconditions: predicate
  - ast_rule: RepeatOnce           # ('Before'|'After') (Trigger|Time|Condition)
    condition_type: BEFORE | AFTER
    fields:
      event: event
  - ast_rule: WhereStructure
    condition_type: null
    finding: PROFILE-OUT           # MVP対象外（本文がFreeExpressionのため）
  - ast_rule: Frequently           # 'Every'
    condition_type: null
    finding: PROFILE-OUT

# ---- MVP Action対応（family → AST ActionPhrase規則とRole対応） ----
# rimay_action_id は profile/supported-profile.yaml の action_classes と一致させる。
actions:
  - family: SEND
    rimay_action_id: SEND_11_1_1
    role_mapping:
      THEME_TO_SEND: /rimay_core/response/theme
      FROM_LOCATION: /rimay_core/response/source        # 'from'
      DESTINATION: /rimay_core/response/destination     # 'to'
      CHANNEL_THROUGH: /rimay_core/response/channel     # 'through'
  - family: UPDATE
    rimay_action_id: DS_UPDATE
    role_mapping:
      PropertyInstanceOrValueAndItsChange: /rimay_core/response/property
      ToTheValue: /rimay_core/response/result_value     # 'to'
  - family: CREATE
    rimay_action_id: ENGENDER_27
    role_mapping:
      theme: /rimay_core/response/theme
      source: /rimay_core/response/source               # 'from'（Phase 2で統語確定）
  - family: STORE
    rimay_action_id: KEEP_15_2
    role_mapping:
      values_or_properties: /rimay_core/response/theme
      PREPOSITION_LOC place: /rimay_core/response/location
      period: "/extensions/time_constraints（kind: RETENTION）"
    note: "'for a period of' はrimay_coreでなくextensionsへ写像する"
  - family: RECEIVE
    rimay_action_id: OBTAIN_13_5_2
    role_mapping:
      theme: /rimay_core/response/theme
      source: /rimay_core/response/source               # 'from'
      CHANNEL_THROUGH: /rimay_core/response/channel     # 'through'（0.1.1: 格フレームSSOTと整合）
  - family: DISPLAY
    rimay_action_id: REFLEXIVE_APPEARANCE_48_1_2   # 0.2.0是正（D7 R-1/CG-09。旧SEE_30_1_1はdetect専用）
    emse_rule_id: REFLEXIVE_APPEARANCE-48.1.2      # EMSE規則IDは別軸（1フィールドへ統合しない。§2.5）
    role_mapping:
      theme: /rimay_core/response/theme
      OnPhrase: /rimay_core/response/display_location   # 前置詞はonで固定（CG-09。in不受理）
    note: 前置詞→Role写像の実行正本はprofile/english-rimay-conformance.yaml
  - family: DELETE
    rimay_action_id: REMOVE_10_1
    role_mapping:
      theme: /rimay_core/response/theme
  - family: VERIFY
    rimay_action_id: DS_VALIDATE
    role_mapping:
      NonUIComponentInstanceOrClassToBeValidated: /rimay_core/response/theme
      rule_reference: /rimay_core/response/rule         # 'in compliance with'
  - family: CALCULATE
    rimay_action_id: CREATE_26_4
    role_mapping:
      result: /rimay_core/response/result
      input: /rimay_core/response/input                 # 'using'で固定（0.2.0是正。CG-09。from/based onは不受理）
  - family: NOTIFY
    rimay_action_id: SAY_37_7
    role_mapping:
      content: /rimay_core/response/content             # 動詞直後のtopic（SAY_37_7語順。0.2.0是正）
      destination_actor: /rimay_core/response/destination   # 'to'
      CHANNEL_USING: /rimay_core/response/channel       # 'using'（0.2.0是正。旧of/through形は不受理）

# ---- 宣言部の対応（用語辞書との整合） ----
declarations:
  - {ast_rule: Actor,    term_type: actor}
  - {ast_rule: Class,    term_type: class}
  - {ast_rule: PropertyId, term_type: property}
  - {ast_rule: Unit,     term_type: unit}
  - {ast_rule: UIComponent, term_type: ui_component}

# ---- 正規化規則（射影意味等価比較で無視する差） ----
normalization:
  ignore:
    - 冠詞（a / an / the）
    - 引用符の有無・種類
    - 動詞の三単現形（send / sends）
    - 空白・改行・箇条書き形式の差
    - shall / must の別（いずれもMUSTへ正規化）
  compare:
    - Condition Type
    - action family（rimay_action_idはSerializer検証でのみ比較）
    - Entity Reference（用語辞書の内部ID単位）
    - Semantic Role の割当て
    - モダリティ（MUST / MUST_NOT）
    - 論理構造（AND/OR、Phase 4以降）
    - 順序構造

# ---- 逆方向（rimay_core → English Rimay）の契約 ----
serialization:
  note: >-
    English Rimay Serializerは本対応表の逆写像として実装する。
    rimay_action_idからActionPhrase規則を選択し、role_mappingの
    前置詞・統語順で英語文を生成する。生成文はParser受理（Level 3）を
    必須とし、受理失敗はAST-EQUIVALENCEではなくSerializer欠陥として扱う。
