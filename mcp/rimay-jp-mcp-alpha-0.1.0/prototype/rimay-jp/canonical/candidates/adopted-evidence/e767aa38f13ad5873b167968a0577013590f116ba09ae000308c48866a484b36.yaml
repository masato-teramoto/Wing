verdict_rules:
  exact: 両側とも未対応ゼロ・全pairが exact/name_normalized_exact・locator が exhaustive
  matched_with_rename: 両側とも未対応ゼロ・1件以上が renamed_alternative
  matched_not_exhaustive: 両側とも未対応ゼロ・改称なし・locator が exhaustive でない
  partial: 実装側または出版版側に未対応が残る
  unmappable_locator_unusable: '対応先候補が usable_for_determination: false の locator のみ'
  indeterminate: 上記いずれにも構造上到達しない（pairが空・pair kind が値域外 等）
resolutions:
  resolved: 原典側・実装側の全分岐が、対応／処遇明示／対象production外 のいずれかで説明済み
  unresolved: 説明できていない分岐が残る（pending_investigation を含む）
structural_relations:
  equivalent: 原典分岐と実装分岐が過不足なく対応する
  semantic_subset: 実装が原典分岐の一部を**欠く**（原典側に未対応が残る）
  semantic_superset: 実装が原典分岐に加えて**独自分岐を持つ**（実装側に未対応が残る）
  semantic_divergent: 欠落と追加の**双方**がある
  not_compared: 内部分岐を比較していない（対応の主張を分岐粒度へ及ぼさない）
unmatched_dispositions:
  extension_reference: 原典に無い実装分岐。**別Capability**が採否を裁定する（本Capabilityへ混ぜない）
  pending_investigation: 処遇未定。これがあると対応証拠は resolved にならない
pair_kinds:
  exact: 実装規則名と出版版member名が完全一致
  name_normalized_exact: 宣言済み normalization を適用すると一致（改称ではない）
  renamed_alternative: 位置・役割は一致するが名称が異なる（改称）
normalizations:
  strip_suffix_Structure: 実装規則名の末尾 `Structure` を除去して比較する
  identity_upper_snake: 実装のUpperCamelを UPPER_SNAKE へ変換して比較する
  upper_snake_acronym_aware: UpperCamelを UPPER_SNAKE へ変換する。連続する大文字は頭字語として1語に保つ（UIComponent… → UI_COMPONENT_…）
  not_applicable: 対応pairが無いため正規化しない
out_of_scope_reasons:
  different_production: 同一Listing内の別ruleであり、対象productionの選択肢ではない
evidence_exclusions:
- '`S1-4.2.2-OPERATOR-EXAMPLES` は `usable_for_determination: false`。`published_locator` に置けない構造制約で、例示から閉じた結論を出す経路を塞ぐ。'
- '`S1-4.2.2-NEGATIVE-FORMS` は本レポートの根拠に**使わない**。否定形は families と併記される以上のことを主張せず、`Compare.not` / `Contains.Negation`
  との対応も所属も本レポートからは導かない。'
- matrix の primary ownership は「誰が裁定するか」であって「参照集合の母数」ではない。他Capability所有を理由に `OperatorValuesExpr` の参照から規則を落とさない。
- 負例fixtureは本レポートの根拠に一切使わない。
