# B5-1: B1〜B4 Repository投影面の現時点の製品写像処遇。
# 原典claimの解決状態は下記Matrix、証拠未解決行の製品採否はB5-P planを正本とし、本planへ複製しない。
# CAP-RESPONSE-COMBINATIONはaccepted B5-P bindingとactive Canonical 0.6.0証拠を持ち、
# existing_canonicalへ接続する。裁定済みCAP-CONDITION-COMBINATIONもactive runtimeへ接続する。
# RC-071ではComparison predicateをcardinality-aware selectorで残余Conditionから分離する。
# Itemized Response BlockはCanonical 0.8.0 runtime activation後の別承認でRepository意味写像も
# existing_canonicalへ接続する。Atomic ResponseもCanonical 0.9.0 runtime activation後の別承認で
# existing_canonicalへ接続する。Role clusterはRC-057〜RC-062で製品採用したが、fixed Grammar複数値と
# Canonical単値のcardinality差によりRole面を分離してpreserve-onlyに置く。残る構造も欠落なく保持する。
# RC-079ではMulti-value predicateをRC-078の相互排他selectorで残余Conditionから分離する。
# RC-090ではOperator value expressionの製品採用planをbindingへ追加するが、condition残余の
# preserve-only treatmentと14面構成は変更しない。
