# Finding Code Catalog v0.1（構想書v0.5 §16のSSOT）
# validation-rule.schema.json の finding_code はここに登録されたコードのみ使用可。
# blocking: true のfindingが1件でもあれば review_ready へ遷移できない。
catalog_version: 0.1.0
profile_version: rimay-jp-mvp-0.1.0

codes:
  # --- 日本語解析（JP-*） ---
  - {code: JP-LEXICAL,   category: 語彙,     severity: error,   blocking: true,
     description: 日本語動詞・用語の対応がない,          remedy: 辞書追加,
     detected_by: [normalizer, validate_terminology]}
  # ADR-0014 D4: 語彙形成ループのコアfinding（承認遮断はコアValidator由来の
  # blockingが担う=ADR-0013 D2。rollout（normalized issue policy）経由にしない）
  - {code: TERM_APPROVAL_PENDING, category: 語彙, severity: error, blocking: true,
     description: スロットが未公開のTerm Candidate承認待ちに依存している,
     remedy: 候補の承認・Snapshot公開・伝播Patch, detected_by: [validate_terminology]}
  - {code: AMBIGUOUS_TERM, category: 語彙,    severity: error,   blocking: true,
     description: 同表記が複数の登録概念に一致し一意に解決できない,
     remedy: 適用範囲の利用者確認,               detected_by: [validate_terminology]}
  - {code: DEPRECATED_TERM, category: 語彙,   severity: warning, blocking: false,
     description: 廃止・統合済みの用語を参照している,
     remedy: 後継用語への置換,                   detected_by: [validate_terminology]}
  - {code: JP-MORPH,     category: 活用,     severity: error,   blocking: true,
     description: 動詞活用を原形へ戻せない,              remedy: 活用規則追加,
     detected_by: [normalizer]}
  - {code: JP-CASE,      category: 格,       severity: error,   blocking: true,
     description: 助詞からRoleを特定できない,            remedy: 格フレーム追加・表現制限,
     detected_by: [normalizer, validate_core]}
  - {code: JP-OMISSION,  category: 省略,     severity: error,   blocking: true,
     description: 主体・対象等が省略されている,          remedy: 省略禁止・確認質問,
     detected_by: [normalizer, validate_core]}
  - {code: JP-CONDITION, category: 条件,     severity: error,   blocking: true,
     description: 条件種別を一意に決定できない,          remedy: 接続表現固定,
     detected_by: [normalizer]}
  - {code: JP-MODAL,     category: モダリティ, severity: error, blocking: true,
     description: 必須・禁止等を特定できない,            remedy: 標準表現へ正規化,
     detected_by: [normalizer]}
  - {code: JP-MODIFIER,  category: 修飾,     severity: warning, blocking: false,
     description: 長い連体修飾や係り受けが複雑,          remedy: 要求分割,
     detected_by: [normalizer, validate_core]}
  - {code: JP-COORD,     category: 並列,     severity: error,   blocking: true,
     description: AND/ORの範囲が曖昧,                    remedy: 括弧・列挙・分割,
     detected_by: [normalizer]}

  # --- 既存Rimayの表現力（RIMAY-*） ---
  - {code: RIMAY-ACTION,     category: 動作,     severity: error, blocking: true,
     description: 対応するAction Classがない,            remedy: Action拡張候補,
     detected_by: [normalizer, validate_core]}
  - {code: RIMAY-ROLE,       category: Role,     severity: error, blocking: true,
     description: 必要な意味Roleを表現できない,          remedy: Core/Grammar拡張候補,
     detected_by: [validate_core, render_requirement_views]}
  - {code: RIMAY-MODAL,      category: モダリティ, severity: error, blocking: true,
     description: 既存Rimayに対応概念がない,             remedy: 拡張Profile,
     detected_by: [validate_core]}
  - {code: RIMAY-CONSTRAINT, category: 制約,     severity: info,  blocking: false,
     description: 時間・精度等を英語Rimayで表現できない, remedy: extensions／別要求／拡張評価,
     detected_by: [render_requirement_views]}

  # --- 意味保持 ---
  - {code: AST-EQUIVALENCE, category: 意味等価, severity: error, blocking: true,
     description: AST再正規化結果がrimay_coreと一致しない, remedy: Serializer／Adapter修正,
     detected_by: [check_equivalence]}
  - {code: RIMAY-CONFORMANCE, category: 原典準拠, severity: error, blocking: true,
     description: Grammar conformance差分（rule ID束縛・operator集合・full consumption）が存在する,
     remedy: English conformance profile／Parser／Serializer束縛の是正（C4・RC-005）,
     detected_by: [check_conformance]}
  - {code: SIDECAR-LOSS,    category: 意味欠落, severity: error, blocking: true,
     description: extensionsがsidecarから欠落した,       remedy: sidecar Serializer／Validator修正,
     detected_by: [validate_sidecar]}
  - {code: SIDECAR-STALE,   category: 意味欠落, severity: error, blocking: true,
     description: English Rimayとsidecarのmanifest（canonical_hash等）が不一致,
     remedy: 原子的再生成・manifest検査,
     detected_by: [validate_sidecar]}

  # --- 統制 ---
  - {code: PROFILE-OUT,        category: 対応範囲, severity: error, blocking: true,
     description: Supported Profile外の入力,             remedy: 未対応判定・拡張候補化,
     detected_by: [normalizer, validate_core, rule_engine]}
  - {code: PATCH-INVALID,      category: 更新,     severity: error, blocking: true,
     description: Canonical PatchがSchema・型・状態遷移・base_revisionに違反,
     remedy: Patch拒否・再生成（revision不一致はreason=revision_conflict）,
     detected_by: [apply_canonical_patch]}
  - {code: PROVENANCE-MISSING, category: 根拠,     severity: error, blocking: true,
     description: 確定値または更新に根拠がない,          remedy: proposedへ戻す・確認質問,
     detected_by: [validate_core, apply_canonical_patch]}

  # --- オーケストレーション ---
  - {code: KNOWLEDGE-ROUTE,    category: 知識ルーティング, severity: warning, blocking: false,
     description: 必要な知識源を選択できない・誤選択,    remedy: routing Rule修正,
     detected_by: [rule_engine]}
  - {code: KNOWLEDGE-CONFLICT, category: 知識競合, severity: error, blocking: true,
     description: 複数知識源の内容が矛盾する,            remedy: 人間判断・適用優先度定義,
     detected_by: [validate_domain, rule_engine]}
  - {code: QUESTION-MISMATCH,  category: 質問,     severity: warning, blocking: false,
     description: 質問が不足・曖昧性に対応しない,        remedy: question Rule／template修正,
     detected_by: [rule_engine, evaluation]}
  - {code: QUESTION-ORDER,     category: 質問順序, severity: info,  blocking: false,
     description: 影響度の低い質問を優先した,            remedy: stage/priority修正,
     detected_by: [evaluation]}
  - {code: RULE-CONFLICT,      category: Rule競合, severity: error, blocking: true,
     description: 複数Ruleが矛盾する処理を指示した,      remedy: 排他・優先度・完了条件修正,
     detected_by: [rule_engine]}

  # --- 品質（Phase 2追加。変更理由: §8.8曖昧語検出に対応するコードが§16に無かったため） ---
  - {code: QUALITY-AMBIGUOUS, category: 品質, severity: error, blocking: true,
     description: 測定可能な条件へ変換されていない曖昧語（速やかに等）,
     remedy: 定量化・確認質問（ASK_MEASURABLE_CRITERIA）,
     detected_by: [validate_core]}
  # --- 品質（Phase 3D追加。変更理由: §8.9指示語検出に対応するコードが§16に無かったため） ---
  - {code: QUALITY-DEICTIC, category: 品質, severity: warning, blocking: false,
     description: 指示語（これ・それ・当該・上記等）の使用,
     remedy: 要求IDまたは正式名称へ置換,
     detected_by: [validation_router]}

  # --- その他 ---
  - {code: DOMAIN,            category: 業務固有, severity: error, blocking: true,
     description: 業務固有概念・整合性を判定できない,    remedy: Domain辞書・業務ルール追加,
     detected_by: [validate_domain]}
  - {code: GENERATOR,         category: 下流生成, severity: error, blocking: false,
     description: 必要スロットがあるのに成果物生成できない, remedy: Generator／変換Rule修正,
     detected_by: [generator]}
  - {code: FEEDBACK-UNMAPPED, category: 還流,     severity: warning, blocking: false,
     description: 下流問題を要求・知識へ関連付けられない, remedy: feedback分類・Trace修正,
     detected_by: [feedback_handler]}
  - {code: COMPLEXITY,        category: 複雑性,   severity: warning, blocking: false,
     description: 入れ子や複数動作が過度に複雑,          remedy: 要求分割,
     detected_by: [normalizer, validate_core]}
  - {code: FREE-TEXT,         category: 非構造,   severity: warning, blocking: false,
     description: 構造化不能（暫定FreeExpression使用）,  remedy: 暫定受け皿・拡張候補蓄積,
     detected_by: [normalizer, render_requirement_views]}
