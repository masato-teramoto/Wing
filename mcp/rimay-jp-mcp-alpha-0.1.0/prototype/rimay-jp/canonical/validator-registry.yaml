# Validator Registry v0.2（ADR-0012 D6・ADR-0013 D5）
#
# 各Validatorの主責務と所有issue codeを定義する。同一根因のfindingは
# Validation Routerが normalized_issue_code × target_path で統合（dedup）し、
# owner_validator のfindingを主として残す。
# stage: raw_text = 分割済みsegment/原文への検査（日本語解析はRimay-JP Normalizerの
# 構造化結果を共通入力とし、二重解析しない）。canonical = Canonical Requirementへの検査。
# 0.3.0: terminology-validatorの所有コード拡張（ADR-0014 D4:
#   AMBIGUOUS_TERM／TERM_APPROVAL_PENDING／DEPRECATED_TERM）
registry_version: 0.3.0
profile_version: rimay-jp-mvp-0.1.1
# input_contract（ADR-0013 D5）: 各Validatorが受け取ってよい入力の宣言。
#   raw_text            … 原文文字列（Free-text Import診断のみ）
#   surface_analysis    … Normalizerの表層解析記録（canonical.surface_analysis）
#   canonical_requirement … Canonical本体
#   domain_context      … Canonical＋知識源（状態モデル・業務ルール）
#   validation_report   … Report（メタ検査用）
# Canonical段の実行計画（下記execution_plan.validate_all）にraw_text契約の
# Validatorは配置できない（validation_routerがplan検証で拒否する）。

validators:
  # ---- Pre-Canonical（Raw Text Quality Gate） ----
  - id: information-classifier
    stage: raw_text
    input_contract: raw_text
    engine: rimay-jp-orchestrator          # orchestrator/information_classifier.py（実装済み）
    responsibility: §18の9分類とRequirement Candidate判定
    owns_issue_codes: [NOT_A_REQUIREMENT]

  - id: raw-text-quality-gate
    stage: raw_text
    input_contract: raw_text
    engine: requirement-quality-core       # reqsmell表層Ruleの移植先（Step 3）
    responsibility: 表層スメル（語順・受動態・並列曖昧）の検出
    owns_issue_codes: [INCORRECT_SEGMENT_ORDER, PASSIVE_VOICE, COORDINATION_AMBIGUITY,
                       MULTIPLE_PRIMARY_ACTIONS]  # 非原子性はPre-Canonical診断（ADR-0013 D2）
    notes: reqsmell rules（ja/en）とrule example oracleを移植。決定論・citation維持

  - id: candidate-extractor
    stage: raw_text
    input_contract: raw_text
    engine: rimay-jp-orchestrator          # orchestrator/candidate_extractor.py（実装済み）
    responsibility: 要求候補の部分抽出・Action候補提示（unknown/proposed統制）
    owns_issue_codes: [IMPRECISE_ACTION_VERB]

  # ---- Post-Normalization（Canonical Validation） ----
  - id: canonical-schema-validator
    stage: canonical
    input_contract: canonical_requirement
    engine: rimay-jp-core                  # schema_check.py（実装済み）
    responsibility: canonical-requirement.schema.json 適合
    owns_issue_codes: []

  - id: required-role-validator
    stage: canonical
    input_contract: canonical_requirement
    engine: rimay-jp-core                  # validator.py（実装済み）
    responsibility: 主体・モダリティ・Actionの存在
    owns_issue_codes: [MISSING_RESPONSE_ACTOR, MISSING_MODALITY]

  - id: action-frame-validator
    stage: canonical
    input_contract: canonical_requirement
    engine: rimay-jp-core                  # validator.py 格フレーム充足（実装済み）
    responsibility: Action格フレームの必須Role充足（MUSTのみ。禁止はPhase 2裁定）
    owns_issue_codes: [MISSING_REQUIRED_ROLE]

  - id: condition-validator
    stage: canonical
    input_contract: canonical_requirement
    engine: rimay-jp-core                  # validation_router render precheck（実装済み）
    responsibility: 条件・トリガー事象の完全性
    owns_issue_codes: [MISSING_CONDITION_ACTOR, INCOMPLETE_TRIGGER_EVENT]

  - id: canonical-structural-validator
    stage: canonical
    input_contract: canonical_requirement
    engine: rimay-jp-core                  # Canonical構造の原子性（将来: 複数応答Profile拡張時）
    responsibility: Canonical構造上の一要求一主要応答（現MVP Schemaは単一responseのため実行対象外。ADR-0013 D2）
    owns_issue_codes: []

  - id: terminology-validator
    stage: both
    input_contract: canonical_requirement
    engine: rimay-jp-core                  # normalizer/lexicon（実装済み）
    responsibility: 用語辞書適合・同義語正規化・語彙依存（承認待ち・多義・廃止語）
    owns_issue_codes: [UNREGISTERED_TERM, AMBIGUOUS_TERM,
                       TERM_APPROVAL_PENDING, DEPRECATED_TERM]

  - id: quality-validator
    stage: both
    input_contract: surface_analysis
    engine: requirement-quality-core       # 曖昧語・指示語等（現validate_core/routerから移管）
    responsibility: INCOSE系スメル（曖昧語・指示語・主観語）
    owns_issue_codes: [AMBIGUOUS_TIME_EXPRESSION, DEICTIC_REFERENCE]

  - id: domain-validator
    stage: canonical
    input_contract: domain_context
    engine: rimay-jp-orchestrator          # knowledge_router（実装済み）
    responsibility: 状態モデル・業務ルールとの整合
    owns_issue_codes: [STATE_VALUE_OUT_OF_MODEL]

  - id: profile-validator
    stage: both
    input_contract: canonical_requirement
    engine: rimay-jp-core                  # validator.py PROFILE-OUT（実装済み）
    responsibility: Supported Profile適合・未対応判定
    owns_issue_codes: [UNSUPPORTED_CONSTRUCT]

  - id: equivalence-checker
    stage: canonical
    input_contract: canonical_requirement
    engine: rimay-jp-core                  # equivalence.py（実装済み）
    responsibility: AST射影意味等価
    owns_issue_codes: [SEMANTIC_PROJECTION_MISMATCH]

  - id: sidecar-validator
    stage: canonical
    input_contract: canonical_requirement
    engine: rimay-jp-core                  # equivalence.check_sidecar（実装済み）
    responsibility: sidecar完全性・manifest整合
    owns_issue_codes: [EXTENSION_LOSS]

# Canonical段の実行計画（ADR-0013 D5: validation_routerは本計画から生成する。
# phase: pre = 常時実行 / post = blocking無しのときのみ（表層生成・往復検査）
execution_plan:
  validate_all:
    - {binding: schema,            input_contract: canonical_requirement, phase: pre,
       validators: [canonical-schema-validator]}
    - {binding: core,              input_contract: canonical_requirement, phase: pre,
       validators: [required-role-validator, action-frame-validator,
                    terminology-validator, profile-validator, condition-validator]}
    - {binding: quality_surface,   input_contract: surface_analysis,      phase: pre,
       validators: [quality-validator]}
    - {binding: domain,            input_contract: domain_context,        phase: pre,
       validators: [domain-validator]}
    - {binding: render_precheck,   input_contract: canonical_requirement, phase: pre,
       validators: [condition-validator]}
    - {binding: surface_roundtrip, input_contract: canonical_requirement, phase: post,
       validators: [equivalence-checker, sidecar-validator]}

dedup_policy:
  key: [normalized_issue_code, target_path]
  rule: 同一キーのfindingはowner_validatorのものを主とし、他validatorの検出は
        evidenceへ併合する。severityは最大値を採用する。
