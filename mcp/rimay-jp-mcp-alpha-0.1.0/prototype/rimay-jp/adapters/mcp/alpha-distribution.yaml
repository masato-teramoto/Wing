# Rimay-JP MCP alpha distribution contract.
# This is an internal-validation bundle, not a public redistribution grant.
distribution_version: 0.1.0
mode: private_internal_alpha_bundle
audience: internal_validation
repository_visibility_required: private

server:
  implementation: prototype/rimay-jp/adapters/mcp/rimay_jp_mcp.py
  transport: stdio
  packaging: existing_shared_mcp_server
  separate_server: false

fixed_grammar:
  source_repository: https://github.com/SNTSVV/Rimay
  source_commit: 7308c20125f6678333282e31cda75a82e68b4970
  source_path: org.xtext.dsl_rimay/src/org/xtext/Dsl_rimay.xtext
  bundled_path: prototype/rimay-jp/adapters/mcp/assets/Dsl_rimay.xtext
  sha256: sha256:0f7c4af22ab60329e85b972951be46bedecae2da2a5913b10d2f01d05bb1aa7e
  license_status: absent
  permitted_scope: private_internal_validation_only
  public_redistribution: prohibited
  environment_override: RIMAY_FIXED_GRAMMAR

runtime_bundle:
  include_paths:
    - prototype/rimay-jp/adapters/mcp
    - prototype/rimay-jp/core
    - prototype/rimay-jp/orchestrator
    - prototype/rimay-jp/generators
    - prototype/rimay-jp/canonical
    - prototype/rimay-jp/lexicon
    - prototype/rimay-jp/profile
    - prototype/rimay-jp/terminology
    - prototype/rimay-jp/demo
    - prototype/rimay-jp/quality/src
    - prototype/rimay-jp/quality/knowledge
    - prototype/rimay-jp/quality/schemas
  development_and_evaluation_exclude_roots:
    - prototype/rimay-jp/tests
    - prototype/rimay-jp/corpus
    - prototype/rimay-jp/reports
    - prototype/rimay-jp/scripts

host_integration:
  include_paths:
    - .claude/skills/rimay-spec-alpha-check
  manual_skill: rimay-spec-alpha-check
  generated_files:
    - .mcp.json
    - requirements.txt
    - BUNDLE-README.md
    - bundle-manifest.json
    - SHA256SUMS

sunset:
  trigger: beta_or_later
  remove:
    - prototype/rimay-jp/adapters/mcp/assets/Dsl_rimay.xtext
    - repository_local_mcp_server_distribution
  replacement: externally_provided_mcp_server
