# モダリティ終端表現の正規化（構想書 §10）
# MVP は初期プロファイル（必須・禁止）のみ。拡張プロファイルは検証対象外。
modality:
  - meaning: 必須
    japanese_standard: しなければならない
    english_keyword: must
    tag: 【必須】

  - meaning: 禁止
    japanese_standard: してはならない
    english_keyword: must not
    tag: 【禁止】

# 拡張プロファイル（MVP対象外 — 出現したら JP-MODAL / RIMAY-MODAL として記録）
extension_profile:
  - meaning: 許可
    japanese_standard: してよい
    note: may相当。既存Grammar拡張要否を評価
  - meaning: 能力
    japanese_standard: できるようにする
    note: システム機能要求として再記述
  - meaning: 推奨
    japanese_standard: null
    note: 要求とは分離し、設計方針またはGuidelineとして管理
