terms:
- id: BillingSystem
  preferred_japanese: 請求管理システム
  type: actor
  definition: 注文の確定を受けて請求書を作成・発行するシステム
  synonyms:
  - 請求システム
  - Billing System
- id: NotificationSystem
  preferred_japanese: 通知システム
  type: actor
  definition: 確定・警告・エラー等の事象を利用者や管理者へ通知するシステム
  synonyms: []
- id: OrderManagementSystem
  preferred_japanese: 注文管理システム
  type: actor
  definition: 注文の受付から確定・状態管理までを担うシステム
  synonyms: []
- id: AuthenticationSystem
  preferred_japanese: 認証システム
  type: actor
  definition: 利用者の本人性を確認し操作の可否を判定するシステム
  synonyms: []
- id: User
  preferred_japanese: 利用者
  type: actor
  definition: システムを操作する人。権限の区別を問わない総称
  synonyms:
  - ユーザー
  - ユーザ
- id: InvoicePDF
  preferred_japanese: 請求書PDF
  type: class
  definition: 請求内容を確定した状態で出力したPDF形式の帳票
  synonyms:
  - 請求書
  - PDF帳票
- id: CustomerEmailAddress
  preferred_japanese: 顧客メールアドレス
  type: property
  definition: 顧客への連絡先として登録された電子メールアドレス
  synonyms: []
- id: ConfirmOrderButton
  preferred_japanese: 注文確定ボタン
  type: class
  definition: 注文画面上で注文を確定させる操作部品
  synonyms: []
- id: OrderStatus
  preferred_japanese: 注文状態
  type: property
  definition: 1件の注文が受付から請求までのどの段階にあるかを表す状態値
  synonyms: []
- id: DocumentStorage
  preferred_japanese: 文書保管領域
  type: class
  definition: 発行済み帳票や署名済み文書を保存する領域
  synonyms:
  - 文書保管庫
- id: OrderManagement
  preferred_japanese: 注文管理機能
  type: function
  definition: 注文の受付・確定・状態遷移を扱う機能単位
  synonyms: []
- id: SalesChannelSystem
  preferred_japanese: 販売チャネルシステム
  type: actor
  definition: 注文を発生させる外部の販売経路システム（EC・店頭端末等）
  synonyms: []
- id: GeneralUser
  preferred_japanese: 一般利用者
  type: actor
  definition: 管理者権限を持たない一般の操作者。Userのうち権限を限定した部分集合
  synonyms: []
- id: OrderData
  preferred_japanese: 注文データ
  type: class
  definition: 1件の注文を構成するデータ一式
  synonyms: []
- id: AuditLog
  preferred_japanese: 監査ログ
  type: class
  definition: 誰がいつ何を操作したかを事後追跡するために残す記録
  synonyms: []
- id: ElectronicSignature
  preferred_japanese: 電子署名
  type: class
  definition: 文書の作成者と非改変性を証明する電子的な署名
  synonyms: []
- id: TemporaryFile
  preferred_japanese: 一時ファイル
  type: class
  definition: 処理途中で生成され、完了後は保持しないファイル
  synonyms: []
- id: OrderList
  preferred_japanese: 注文一覧
  type: class
  definition: 複数の注文を一覧として並べたもの
  synonyms: []
- id: OrderListButton
  preferred_japanese: 注文一覧ボタン
  type: class
  definition: 注文一覧画面を呼び出す操作部品
  synonyms: []
- id: OrderListScreen
  preferred_japanese: 注文一覧画面
  type: class
  definition: 注文一覧を表示する画面
  synonyms: []
- id: OrderScreen
  preferred_japanese: 注文画面
  type: class
  definition: 個別の注文を入力・確認する画面
  synonyms: []
- id: ApprovalWarning
  preferred_japanese: 承認警告
  type: class
  definition: 承認金額の上限超過など、承認者の判断を促す警告表示
  synonyms: []
- id: OrderConfirmationNotice
  preferred_japanese: 注文確定通知
  type: class
  definition: 注文が確定したことを利用者へ知らせる通知
  synonyms: []
- id: ErrorDetail
  preferred_japanese: エラー内容
  type: class
  definition: 発生した誤りの原因と対象を特定できる説明内容
  synonyms:
  - エラー詳細
- id: Email
  preferred_japanese: 電子メール
  type: class
  definition: 電子メールという伝達手段そのもの。個々の送信対象は別語で表す
  synonyms:
  - メール
- id: Customer
  preferred_japanese: 顧客
  type: class
  definition: 注文の発注元となる取引先。組織・個人を問わない
  synonyms: []
- id: SignatureVerificationRule
  preferred_japanese: 署名検証規則
  type: rule
  definition: 電子署名の正当性を判定する業務規則
  synonyms: []
- id: InputValidationRule
  preferred_japanese: 入力検証規則
  type: rule
  definition: 入力値が受理可能かを判定する業務規則
  synonyms: []
- id: OrderAmount
  preferred_japanese: 注文金額
  type: property
  definition: 注文1件の金額
  synonyms: []
- id: ApprovalAmount
  preferred_japanese: 承認金額
  type: property
  definition: 承認を要するか否かの判定に用いる金額のしきい値
  synonyms: []
- id: TotalAmount
  preferred_japanese: 合計金額
  type: property
  definition: 複数明細を合算した金額
  synonyms: []
- id: MaintenanceMode
  preferred_japanese: メンテナンスモード
  type: property
  definition: システムが保守作業中で通常操作を受け付けない状態か否かを表す設定
  synonyms: []
- id: ValidationResult
  preferred_japanese: 検証結果
  type: property
  definition: 検証処理が成立したか否かの結果値
  synonyms: []
- id: AdministratorEmailAddress
  preferred_japanese: 管理者メールアドレス
  type: property
  definition: 管理者への通知先として登録された電子メールアドレス
  synonyms: []
- id: Confirmed
  preferred_japanese: 確定
  type: value
  definition: OrderStatusの値。注文内容が確定し変更を受け付けない段階
  synonyms: []
- id: Billed
  preferred_japanese: 請求済
  type: value
  definition: OrderStatusの値。確定した注文に対し請求を発行し終えた段階
  synonyms: []
- id: Active
  preferred_japanese: 有効
  type: value
  definition: MaintenanceMode等の設定値。機能が働いている状態
  synonyms: []
- id: Failed
  preferred_japanese: 失敗
  type: value
  definition: ValidationResultの値。検証が成立しなかったこと
  synonyms: []
- id: Accepted
  preferred_japanese: 受付
  type: value
  definition: OrderStatusの値。注文を受け付けたが確定前の段階
  synonyms: []
- id: Unconfirmed
  preferred_japanese: 未確定
  type: value
  definition: OrderStatusの値。注文内容がまだ確定していない段階
  synonyms: []
- id: Inactive
  preferred_japanese: 無効
  type: value
  definition: MaintenanceMode等の設定値。機能が働いていない状態
  synonyms: []
- id: Succeeded
  preferred_japanese: 成功
  type: value
  definition: ValidationResultの値。検証が成立したこと
  synonyms: []
- id: MailDeliverySystem
  preferred_japanese: メール配信システム
  type: actor
  definition: 会社別の宛先へメールを振り分けて配信するシステム
  scope: project:REQ-DEMO
  synonyms: []
- id: Administrator
  preferred_japanese: 管理者
  type: actor
  definition: 会社マスタを保守し未一致メールの通知を受ける運用担当者
  scope: project:REQ-DEMO
  synonyms: []
- id: RecipientDomain
  preferred_japanese: 宛先ドメイン
  type: property
  definition: 送信メールの宛先アドレスのドメイン部
  scope: project:REQ-DEMO
  synonyms: []
- id: RegisteredCompanyDomain
  preferred_japanese: 登録済み会社ドメイン
  type: property
  definition: 会社マスタに登録済みの会社のドメイン
  scope: project:REQ-DEMO
  synonyms: []
- id: CompanyEntry
  preferred_japanese: 会社レコード
  type: property
  definition: 会社マスタ内の1社分の登録内容
  scope: project:REQ-DEMO
  status: deprecated
  synonyms: []
- id: EnteredCompanyRecord
  preferred_japanese: 入力された会社情報
  type: property
  definition: 管理者が保守画面で入力した会社の内容
  scope: project:REQ-DEMO
  status: deprecated
  synonyms: []
