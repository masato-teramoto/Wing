# 語彙形成ループのライフサイクル契約（ADR-0014／ADR-0016）
# Schema正本: canonical/term-occurrence.schema.json / term-candidate.schema.json
# 1.0.0: 単一Snapshot 0.1.0から案件＋組織Snapshotの固定Contextへ移行。
lifecycle_version: 1.0.0

vocabulary_registry:
  schema: canonical/vocabulary-project-registry.schema.json
  configured_by: server
  client_input: project_id_only
  prohibited_client_input: [vocabulary_root, lexicon_base, terminology_root, file_path]
  physical_layout:
    organization: <vocabulary-root>/org/common/
    project: <vocabulary-root>/projects/<project-id>/
  ownership_rule: 保存レコードのproject_idと操作project_idが一致しなければ拒否

vocabulary_context:
  schema: canonical/vocabulary-context.schema.json
  context_version: 1.0.0
  required: [project_id, project, organization]
  pin_per_operation: true
  cache_key: [project_id, project.snapshot_id, project.content_hash,
    organization.snapshot_id, organization.content_hash]
  selection: stateless（MCP呼出しごとにproject_id必須。session/env暗黙選択は禁止）

# --- 三層のライフサイクル（D1。1本の状態機械にしない） ---

term_occurrence:
  mutability: immutable          # 出現記録は不変イベント。状態を持たない
  id_prefix: TO-
  store: projects/<project-id>/terminology/occurrences.jsonl
  producer: terminology_orchestrator  # 明示操作 observe_term_occurrence のみ（D2）
  note: Normalizer/Extractorは terminology_observations を戻り値で返すだけで
    書き込まない（決定論・再入安全。corpus再実行やMCP再試行で増殖しない）

term_resolution:                 # Occurrenceの解決状況（Occurrenceと分離管理）
  id_ref: occurrence_id
  store: terminology/resolutions/
  record:
    required: [occurrence_id, status]
    status: [unresolved, resolved]
    resolved_term_id: 解決時のqualified term ID（rimay-term:v1:<scope>:<id>）
    snapshot_id: 解決に使用した案件Vocabulary Snapshot
    vocabulary_context: 案件・組織双方の固定Snapshot ID/hash/source_ref
    resolved_at: ISO 8601
  note: 新規Term/synonym公開時、同surfaceのunresolved Occurrenceを持つ要求が
    re-resolve対象になる（D5影響分類。「新規追加=影響なし」ではない）

term_candidate:
  id_prefix: TC-
  store: projects/<project-id>/terminology/candidates/
  states: [open, under_review, approved, rejected]
  transitions:
    - {from: open, to: under_review, by: human_or_orchestrator}
    - {from: under_review, to: approved, by: human_only, requires: approval_receipt}
    - {from: under_review, to: rejected, by: human_only}
  concurrency: revision楽観ロック（書き込みツールはbase_revision一致を要求）
  required_context:
    project_id: 保存先案件
    proposed_term.scope: project:<project-id>（不一致は拒否）
  prohibited:
    - 候補語をNormalizer/Resolverの正規化解決に供給すること（Gate 2）
    - Action表現（動詞の解釈規則）を候補にすること（D6。
      ACTION_EXPRESSION_UNRESOLVED→ASK_ACTION_MEANINGで扱い、永続管理はP1）
    - findingメッセージの解析からOccurrence/Candidateを再構成すること

published_term:                  # 公開後ライフサイクル（候補の状態と混ぜない）
  states: [active, deprecated, superseded]
  effects:
    deprecated: 使用要求へDEPRECATED_TERM（警告→blocking方針はfinding catalogが正本）
    superseded: DEPRECATED_TERM＋後継term_id提示。使用要求はstale分類

# --- 承認Receipt（D4。回答・文書根拠を束ね、PatchのknowledgeAsset根拠になる） ---

approval_receipt:
  id_prefix: APR-TERM-
  store: projects/<project-id>/terminology/receipts/
  record:
    required: [receipt_id, candidate_id, approved_by, approved_at, resulting_term_id]
    bundled_evidence: 候補のevidence（user_answer/document/occurrence）を凍結コピー
  note: >-
    Canonical Patchのevidenceは単一のまま（既存契約不変）。referenceは
    "term:<term-id>@<snapshot-id>" または "approval-receipt:<receipt-id>" とし、
    Receipt→回答・文書根拠へ追跡する。

# --- Immutable Vocabulary Snapshot（D5） ---

vocabulary_snapshot:
  id_pattern: VOC-<YYYYMMDD>-<NNN>
  stores:
    project: projects/<project-id>/snapshots/<snapshot_id>/
    organization: org/common/snapshots/<snapshot_id>/
  files: [terms.yaml, manifest.json]
  current_pointer: <scope-root>/snapshots/current.json
  immutability: 公開後のSnapshot内容は変更不可（変更は新Snapshot発行）
  supply_rule: 操作開始時に案件・組織双方をID/hashでpinし、案件優先で合成する
  content_hash: sha256（manifest・VocabularyContext・Validation Reportへ記録）
  term_identity: (scope, id)
  qualified_term_id: rimay-term:v1:<percent-encoded-scope>:<percent-encoded-id>
  loader_gates:
    - scopeなし／期待scope不一致を拒否
    - 同一(scope,id)／同一qualified term IDの重複を拒否
    - 案件候補が曖昧・廃止済みならorg:commonへfallbackしない
  publish_precondition: 対象候補すべてにapproval_receiptが存在すること（Gate 5）

# --- 公開→伝播Saga（D4。原子Transactionにしない） ---

terminology_operation:
  id_prefix: TOP-
  store: projects/<project-id>/terminology/operations/
  states: [planning, propagating, retry_required, completed, failed]
  record:
    required: [operation_id, snapshot_id, status, affected_requirements]
    affected_requirements: {<requirement_id>: pending|completed|retry_required}
    impact_kind: {<requirement_id>: re-resolve|re-validate|re-review|stale}
  invariants:
    - 部分完了は永続・可視（隠さない・放置できない）
    - 再実行はidempotent（重複Patch・重複Candidateを生成しない）
    - 伝播未完了（pending/retry_required）のRequirementは
      review_ready／approvedへ進めない

promotion_operation:
  id_prefix: TPO-
  stores:
    organization: org/common/terminology/operations/
    projects: projects/<project-id>/terminology/operations/
  states: [propagating, retry_required, completed]
  immutable_history: 公開済みorg／project Snapshotを書き換えず新Snapshotを発行

# --- 組織共通語彙への昇格（P1。判断は人間・実行は変更公開経路） ---

promotion:
  scope_convention:
    project: "project:<案件名>"      # 案件語彙のscope表記
    organization: "org:common"       # 組織共通語彙
  eligibility:                       # promotion_candidates()が機械判定する前提条件
    - 2案件以上で使用されている
    - type・definitionが競合しない
    - 各案件用語のprovenanceが追跡可能
  human_ruling:                      # 機械判定では昇格しない（advisoryまで）
    - 所有者の明確化・適用範囲の明示・変更影響の特定
    - 組織の知識管理責任者が承認する
  execution:
    operation: promote_to_org_common
    steps:
      - 新しいorg:common qualified termを組織Snapshotへ公開
      - 元の案件Termはin-place変更せず、新案件Snapshotでorg用語にsupersede
      - 影響Requirementを再解決・再検証
    invariants:
      - 人間承認者・承認時刻が必須
      - operation IDで冪等
      - 部分完了／retry_requiredを組織・各案件operation storeへ永続化
      - pending／retry_requiredのRequirementは承認へ進めない

# --- 影響分類（D5） ---

impact_classification:
  new_term_or_synonym: 同surfaceのunresolved Occurrenceを持つ要求 → re-resolve
  type_change: term_id使用要求 → re-validate
  definition_or_scope_change: term_id使用要求 → re-review
  deprecated_or_superseded: term_id使用要求 → stale（後継候補提示）
  homonym_addition: 同surfaceから過去解決した要求 → re-review候補
  reverse_lookup: Canonicalのterm_id ＋ Occurrence/Resolutionのsurface
