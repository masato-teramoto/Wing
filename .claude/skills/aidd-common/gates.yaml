      - { event: requirement-intake-revise, hookPoint: end, when: scripts/repair_pending.py }
      - { event: feature-decomposition-generate, hookPoint: end }
      - { event: feature-decomposition-revise, hookPoint: end, when: scripts/repair_pending.py }
    run: { type: script, target: scripts/gate_id_format.py }

- gate:
