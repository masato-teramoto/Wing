# main_flow policy and inspection events. Declaration order is execution order.

- gate:
    name: implementation-input
    target_event:
      - { event: implement-authoring-generate, hookPoint: start }
      - { event: implement-authoring-revise, hookPoint: start }
      - { event: implement-gate-run, hookPoint: start }
    run: { type: script, target: scripts/implementation_gate.py }

- gate:
    name: feature-sync
    target_event:
      - { event: requirements-authoring-generate, hookPoint: start }
      - { event: design-authoring-generate, hookPoint: start }
      - { event: docs-integration-generate, hookPoint: start }
      - { event: tasks-authoring-generate, hookPoint: start }
      - { event: requirements-authoring-revise, hookPoint: start }
      - { event: design-authoring-revise, hookPoint: start }
      - { event: docs-integration-revise, hookPoint: start }
      - { event: tasks-authoring-revise, hookPoint: start }
      - { event: requirements-plan, hookPoint: start }
      - { event: design-plan, hookPoint: start }
      - { event: tasks-plan, hookPoint: start }
      - { event: requirements-cross-gate, hookPoint: start }
      - { event: design-cross-gate, hookPoint: start }
      - { event: tasks-gate-run, hookPoint: start }
    run: { type: script, target: scripts/sync_features.py }

- gate:
    name: upstream-check
    target_event:
      - { event: requirement-intake-generate, hookPoint: start }
      - { event: steering-authoring-generate, hookPoint: start }
      - { event: feature-decomposition-generate, hookPoint: start }
      - { event: requirements-authoring-generate, hookPoint: start }
      - { event: design-authoring-generate, hookPoint: start }
      - { event: docs-integration-generate, hookPoint: start }
      - { event: tasks-authoring-generate, hookPoint: start }
      - { event: requirement-intake-revise, hookPoint: start }
      - { event: steering-authoring-revise, hookPoint: start }
      - { event: feature-decomposition-revise, hookPoint: start }
      - { event: requirements-authoring-revise, hookPoint: start }
      - { event: design-authoring-revise, hookPoint: start }
      - { event: docs-integration-revise, hookPoint: start }
      - { event: tasks-authoring-revise, hookPoint: start }
      - { event: requirements-plan, hookPoint: start }
      - { event: design-plan, hookPoint: start }
      - { event: tasks-plan, hookPoint: start }
      - { event: requirements-cross-gate, hookPoint: start }
      - { event: design-cross-gate, hookPoint: start }
      - { event: tasks-gate-run, hookPoint: start }
    run: { type: script, target: scripts/check_upstream_approved.py }

- gate:
    name: blockers-check
    target_event:
      - { event: requirement-intake-generate, hookPoint: start }
      - { event: steering-authoring-generate, hookPoint: start }
      - { event: feature-decomposition-generate, hookPoint: start }
      - { event: requirements-authoring-generate, hookPoint: start }
      - { event: design-authoring-generate, hookPoint: start }
      - { event: docs-integration-generate, hookPoint: start }
      - { event: tasks-authoring-generate, hookPoint: start }
      - { event: requirement-intake-revise, hookPoint: start }
      - { event: steering-authoring-revise, hookPoint: start }
      - { event: feature-decomposition-revise, hookPoint: start }
      - { event: requirements-authoring-revise, hookPoint: start }
      - { event: design-authoring-revise, hookPoint: start }
      - { event: docs-integration-revise, hookPoint: start }
      - { event: tasks-authoring-revise, hookPoint: start }
      - { event: requirements-plan, hookPoint: start }
      - { event: design-plan, hookPoint: start }
      - { event: tasks-plan, hookPoint: start }
      - { event: requirements-cross-gate, hookPoint: start }
      - { event: design-cross-gate, hookPoint: start }
      - { event: tasks-gate-run, hookPoint: start }
    run: { type: script, target: scripts/check_no_open_blockers.py }

- gate:
    name: repair-request-check
    target_event:
      - { event: requirement-intake-revise, hookPoint: start, when: scripts/repair_pending.py }
      - { event: steering-authoring-revise, hookPoint: start, when: scripts/repair_pending.py }
      - { event: feature-decomposition-revise, hookPoint: start, when: scripts/repair_pending.py }
      - { event: requirements-authoring-revise, hookPoint: start, when: scripts/repair_pending.py }
      - { event: design-authoring-revise, hookPoint: start, when: scripts/repair_pending.py }
      - { event: docs-integration-revise, hookPoint: start, when: scripts/repair_pending.py }
      - { event: tasks-authoring-revise, hookPoint: start, when: scripts/repair_pending.py }
    run: { type: script, target: scripts/check_repair_request.py }

- gate:
    name: plan
    target_event:
      - { event: steering-authoring-generate,    hookPoint: start }
      - { event: feature-decomposition-generate, hookPoint: start }
      - { event: docs-integration-generate,      hookPoint: start }
    run: { type: script, target: scripts/plan.py, requiresHuman: true }

- gate:
    name: authoring-result-check
    target_event:
      - { event: requirement-intake-generate, hookPoint: end }
      - { event: requirement-intake-revise, hookPoint: end }
      - { event: steering-authoring-generate, hookPoint: end }
      - { event: steering-authoring-revise, hookPoint: end }
      - { event: feature-decomposition-generate, hookPoint: end }
      - { event: feature-decomposition-revise, hookPoint: end }
      - { event: requirements-authoring-generate, hookPoint: end }
      - { event: requirements-authoring-revise, hookPoint: end }
      - { event: design-authoring-generate, hookPoint: end }
      - { event: design-authoring-revise, hookPoint: end }
      - { event: docs-integration-generate, hookPoint: end }
      - { event: docs-integration-revise, hookPoint: end }
      - { event: tasks-authoring-generate, hookPoint: end }
      - { event: tasks-authoring-revise, hookPoint: end }
    run: { type: script, target: scripts/authoring_results.py }

- gate:
    name: snapshot
    target_event:
      - { event: implement-gate-run, hookPoint: start }
      - { event: requirement-intake-generate, hookPoint: end }
      - { event: requirement-intake-revise, hookPoint: end, when: scripts/repair_pending.py }
      - { event: steering-authoring-generate, hookPoint: end }
      - { event: steering-authoring-revise, hookPoint: end, when: scripts/repair_pending.py }
      - { event: feature-decomposition-generate, hookPoint: end }
      - { event: feature-decomposition-revise, hookPoint: end, when: scripts/repair_pending.py }
      - { event: requirements-authoring-generate, hookPoint: end }
      - { event: requirements-authoring-revise, hookPoint: end, when: scripts/repair_pending.py }
      - { event: requirements-cross-gate, hookPoint: start }
      - { event: design-authoring-generate, hookPoint: end }
      - { event: design-authoring-revise, hookPoint: end, when: scripts/repair_pending.py }
      - { event: design-cross-gate, hookPoint: start }
      - { event: docs-integration-generate, hookPoint: end }
      - { event: docs-integration-revise, hookPoint: end, when: scripts/repair_pending.py }
      - { event: tasks-authoring-generate, hookPoint: end }
      - { event: tasks-authoring-revise, hookPoint: end, when: scripts/repair_pending.py }
      - { event: tasks-gate-run, hookPoint: start }
    run: { type: script, target: scripts/snapshot_artifacts.py }

- gate:
    name: id-format-check
    target_event:
