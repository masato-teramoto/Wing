      - { event: requirement-intake-revise, hookPoint: end, when: scripts/repair_pending.py }
    run: { type: script, target: scripts/gate_revision_diff.py }

- gate:
    name: dependency-cycle-check
    target_event:
      - { event: feature-decomposition-generate, hookPoint: end }
      - { event: feature-decomposition-revise, hookPoint: end, when: scripts/repair_pending.py }
      - { event: tasks-authoring-generate, hookPoint: end }
      - { event: tasks-authoring-revise, hookPoint: end, when: scripts/repair_pending.py }
    run: { type: script, target: scripts/gate_dependency_cycle.py }

- gate:
    name: sequence-consistency-check
    target_event:
      - { event: feature-decomposition-generate, hookPoint: end }
      - { event: feature-decomposition-revise, hookPoint: end, when: scripts/repair_pending.py }
      - { event: tasks-authoring-generate, hookPoint: end }
      - { event: tasks-authoring-revise, hookPoint: end, when: scripts/repair_pending.py }
    run: { type: script, target: scripts/gate_sequence_consistency.py }

- gate:
    name: intake-check
    target_event:
      - { event: requirement-intake-generate, hookPoint: end }
      - { event: requirement-intake-revise, hookPoint: end, when: scripts/repair_pending.py }
    run:
      type: skill
      isAgent: true
      target: intake-check
      calls:
        - format-conformance
        - traceability
        - ssot-consistency
        - evidence-guard
        - internal-contradiction-detection
        - classification-validity
        - summarization-fidelity
        - adhoc-entry-validity
        - legal-compliance-identification
        - gap-proposal
        - gate-report

- gate:
    name: steering-check
    target_event:
      - { event: steering-authoring-generate, hookPoint: end }
      - { event: steering-authoring-revise, hookPoint: end, when: scripts/repair_pending.py }
    run:
      type: skill
      isAgent: true
      target: steering-check
      calls:
        - format-conformance
        - ssot-consistency
        - traceability
        - ssot-consistency
        - steering-conformance
        - iso25010-coverage
        - stride-coverage
        - slo-quantification
        - evidence-guard
        - gate-report

