# 遡及区分の宣言：L4（検査 Skill・scripts・check-runner。L4 修正計画 M-15）（計画 v3 §6.5、implement-repin）。
# 配布の改訂で資材を変えたとき、その差分が Phase 8 の判定（検証・レビューの基準、証跡の照合）を変えるかを宣言する。
# - path：配布物（案件）での資材のパス（.claude/ から）
# - from / to：変更前後のファイルの SHA-256（前後の hash が一致したときだけ適用。版を飛ばした更新は連鎖でつなぐ）
# - class：遡及不要（判定を変えない。再固定記録で同値とみなす）／再検査要（3 段の (2) で実検査する）
# 宣言の無い差分は再検査要として扱う（推定で遡及不要にしない）。4 定義ファイル（command・flow・action・gate.yaml）は対象外。
