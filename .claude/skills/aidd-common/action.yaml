# Phase 8 uses declared flows. item is a stable task item for task work,
# and a feature name only for its final independent inspection/review.
# The task events have no fixed outputs: each task's allowed paths come from tasks.md at run time.
# {feature} of a task action is the feature of the running task, not the task item.
- action:
    name: implement-authoring-generate
    inputs:
      - .aidd/feature-list.md
      - steering/product.md
      - steering/tech.md
      - steering/architecture.md
      - steering/security.md
      - steering/non-functional.md
      - steering/database.md
      - steering/api-standards.md
      - docs/code-design.md
      - docs/architecture/data-model.md
      - docs/architecture/system-overview.md
      - specs/{feature}/requirements.md
      - specs/{feature}/design.md
      - specs/{feature}/tasks.md
    run: { type: skill, target: implement-authoring }

- action:
    name: implement-authoring-revise
    inputs:
      - .aidd/feature-list.md
      - steering/product.md
      - steering/tech.md
      - steering/architecture.md
      - steering/security.md
      - steering/non-functional.md
      - steering/database.md
      - steering/api-standards.md
      - docs/code-design.md
      - docs/architecture/data-model.md
      - docs/architecture/system-overview.md
      - specs/{feature}/requirements.md
      - specs/{feature}/design.md
      - specs/{feature}/tasks.md
    run: { type: skill, target: implement-revision }

- action:
    name: implement-gate-run
    inputs:
      - .aidd/feature-list.md
      - steering/product.md
      - steering/tech.md
      - steering/architecture.md
      - steering/security.md
      - steering/non-functional.md
      - steering/database.md
      - steering/api-standards.md
      - docs/code-design.md
      - docs/architecture/data-model.md
      - docs/architecture/system-overview.md
      - specs/{feature}/requirements.md
      - specs/{feature}/design.md
      - specs/{feature}/tasks.md
    outputs:
      - .aidd/implementation/features/{feature}/review.json
    run:
      type: skill
      isAgent: true
      target: implement-check
      calls: [implementation-traceability, implementation-boundary, implementation-tests, gate-report]
