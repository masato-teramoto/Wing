      - docs/code-design.md
      - docs/architecture/data-model.md
      - docs/architecture/system-overview.md
      - specs/{feature}/requirements.md
      - specs/{feature}/design.md
      - specs/{feature}/tasks.md
    run: { type: skill, target: implement-revision }

- action:
    name: implement-gate-run
    inputs:
      - .aidd/feature-list.md
      - steering/product.md
      - steering/tech.md
      - steering/architecture.md
      - steering/security.md
      - steering/non-functional.md
      - steering/database.md
      - steering/api-standards.md
      - docs/code-design.md
      - docs/architecture/data-model.md
      - docs/architecture/system-overview.md
      - specs/{feature}/requirements.md
      - specs/{feature}/design.md
      - specs/{feature}/tasks.md
    outputs:
      - .aidd/implementation/features/{feature}/review.json
    run:
      type: skill
      isAgent: true
      target: implement-check
      calls: [implementation-traceability, implementation-boundary, implementation-tests, finding-verification, gate-report]

# Phase 8 の案件レベル（全 feature の実装承認の後、両方式。§6.11）。item は group（build・smoke）／ACE 計画のチャンク ID。
# feature を持たず、記録（phase-8-implement.md）を書かない。本体の run はゲートが保存した受領証を確かめるだけの L3 の script。
- action:
    name: implement-integration-run
    run: { type: script, target: scripts/implementation_project_check.py }

- action:
    name: implement-cross-ace-run
    run: { type: script, target: scripts/implementation_project_check.py }

# 実コードの横断確認（item 無し、全件。分割しない）。検査本体は run（既存の横断系と同じ例外。L4 修正計画 U-03）。
# 検査対象は全 feature の実装承認・全体結合確認・横断 ACE の受領証を束ねた cross-review.json。記録は phase-8 の `cross` scope。
- action:
    name: implement-cross-gate
    outputs:
      - .aidd/implementation/cross-review.json
    run:
      type: skill
      isAgent: true
      target: implement-cross-check
      calls: [implementation-traceability, implementation-boundary, finding-verification, gate-report]

# 管理用の action（工程に属さない、§6.4）。inputs・outputs を持たず、記録（phase-N.md）に書かない。
# 確認表示を出すだけで状態を変えない。確定は host 操作 switch-mode（入口 Skill が人の確定の回答を受けて呼ぶ）。
- action:
    name: mode-switch-confirm
    run: { type: script, target: scripts/mode_switch.py }
