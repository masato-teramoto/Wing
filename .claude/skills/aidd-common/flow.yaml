# L3 の固定アクション順。工程ごとに 1 つの flow を置き、flow 名を工程名とする。
# 生成の Skill（手順の宣言 `役割: 生成（generate）`）を含む flow が工程であり、その並び順が工程番号になる。
# 工程の flow 名は L3 の規則が使う工程名（intake / steering / feature / requirements / design / docs / tasks / implement）から変えない。
# 手順（steps）はアクション（- action:）か、入れ子の flow（- flow:）。Phase 1–8 は生成（-generate）→ 修正（-revise）の順。
# L0 は呼ばれた flow・アクションを 1 回ぶんだけたどる（繰り返しを知らない。L0 engine.md §1）。
#   feature ごと・修正の回の繰り返しは入口 Skill の手順が持ち、1 回ごとに生成・修正のアクションを --item 付きで呼ぶ。
#   修正要求が無ければ修正のアクションは呼ばれない（その検査・人間レビューも走らない）。
# Phase 8 のタスクは L3 の implement-next がタスク item を付けて flow implement を呼ぶ（生成 → 生成直後の空修正）。
# feature 最終検査・承認は別 flow。

- flow:
    name: intake                      # Phase 1
    steps:
      - action: requirement-intake-generate
      - action: requirement-intake-revise

- flow:
    name: steering                    # Phase 2。plan は gate.yaml の start ゲート
    steps:
      - action: steering-authoring-generate
      - action: steering-authoring-revise

- flow:
    name: feature                     # Phase 3。plan は gate.yaml の start ゲート
    steps:
      - action: feature-decomposition-generate
      - action: feature-decomposition-revise

- flow:
    name: requirements-init           # /aidd-requirements-init（Phase 1〜3）
    steps:
      - flow: intake
      - flow: steering
      - flow: feature

- flow:
    name: requirements                # /aidd-requirements（Phase 4）
    steps:
      - action: requirements-authoring-generate
      - action: requirements-authoring-revise

- flow:
    name: design                      # /aidd-design 前半（Phase 5）
    steps:
      - action: design-authoring-generate
      - action: design-authoring-revise

- flow:
    name: docs                        # /aidd-design 後半（Phase 6）。plan は gate.yaml の start ゲート（docs-plan）
    steps:
      - action: docs-integration-generate
      - action: docs-integration-revise

- flow:
    name: tasks                       # /aidd-tasks（Phase 7）
    steps:
      - action: tasks-authoring-generate
      - action: tasks-authoring-revise

- flow:
    name: implement                   # /aidd-implement（Phase 8）のタスク。タスク item を付けて呼ぶ。
    steps:
      - action: implement-authoring-generate
      - action: implement-authoring-revise

- flow:
    name: implement-review            # Phase 8 の feature 最終検査・承認。工程の flow ではないため改名できる。
    steps:
      - action: implement-gate-run
