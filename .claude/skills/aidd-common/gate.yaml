# main_flow policy and inspection gates. Declaration order is execution order.
#
# target_review（各差し口の検査対象）: 省略時はアクションの出力すべて。
# - 検査ゲート（<工程>-check）の値が、そのアクションの検査・承認の対象になる（-generate と -revise は同じ値）。
# - 機械検査 script（id-format / revision-diff / dependency-cycle / sequence-consistency）は、出力の一部に絞れる。
# - それ以外のゲートは、同じアクションの検査ゲートと同じ値を書く（違えば実行時に失敗する）。
#   検査対象を変えるときは、そのアクションの行をすべて同じ値に直す。
# - `"**"` はアクションの出力すべて（Phase 8 のタスクのように出力が実行ごとに決まるもの）。
# - 出力が複数ある steering / docs はファイル名を 1 行ずつ書く（ブロック形式。同梱パーサは複数行の { } を読めない）。
#   出力を追加したら、その工程の全行に追記する（配布する gate.yaml が全出力を検査することは試験で確認する）。
# - 出力が複数ある steering / docs はファイル名を 1 行ずつ書く（ブロック形式。同梱パーサは複数行の { } を読めない）。
#   出力を追加したら、その工程の全行に追記する（配布する gate.yaml が全出力を検査することは試験で確認する）。

# Phase 8 のタスク単位のレビュー（L4）。適用の条件（when）は持たない。各ゲートが自分で「該当なし」を判断する。
- gate:
    name: task-quality-feature
    target_action:
      - { action: implement-gate-run, hookPoint: start, target_review: [".aidd/implementation/**"] }
    run: { type: script, target: scripts/gate_task_quality.py }

- gate:
    name: task-quality-policy
    target_action:
      - { action: implement-authoring-generate, hookPoint: start, target_review: ["**"] }
      - { action: implement-authoring-revise, hookPoint: start, target_review: ["**"] }
      - { action: implement-gate-run, hookPoint: start, target_review: [".aidd/implementation/**"] }
    run: { type: script, target: scripts/gate_task_quality.py }

- gate:
    name: task-code-review-baseline
    target_action:
