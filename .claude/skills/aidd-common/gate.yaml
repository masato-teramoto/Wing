      - { action: design-authoring-generate, hookPoint: start, target_review: ["specs/{item}/design.md"] }
      - action: docs-integration-generate
        hookPoint: start
        target_review:
          - docs/code-design.md
          - docs/architecture/data-model.md
          - docs/architecture/system-overview.md
      - { action: tasks-authoring-generate, hookPoint: start, target_review: ["specs/{item}/tasks.md"] }
      - { action: requirements-authoring-revise, hookPoint: start, target_review: ["specs/{item}/requirements.md"] }
      - { action: design-authoring-revise, hookPoint: start, target_review: ["specs/{item}/design.md"] }
      - action: docs-integration-revise
        hookPoint: start
        target_review:
          - docs/code-design.md
          - docs/architecture/data-model.md
          - docs/architecture/system-overview.md
      - { action: tasks-authoring-revise, hookPoint: start, target_review: ["specs/{item}/tasks.md"] }
      - { action: requirements-plan, hookPoint: start, target_review: ["specs/**"] }
      - { action: design-plan, hookPoint: start, target_review: ["specs/**"] }
      - { action: tasks-plan, hookPoint: start, target_review: ["specs/**"] }
      - { action: requirements-cross-gate, hookPoint: start, target_review: ["specs/**"] }
      - { action: design-cross-gate, hookPoint: start, target_review: ["specs/**"] }
      - { action: tasks-gate-run, hookPoint: start, target_review: ["specs/**"] }
    run: { type: script, target: scripts/sync_features.py }

